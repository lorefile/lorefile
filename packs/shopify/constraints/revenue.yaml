constraints:
  - id: SH-001
    name: Test orders are never revenue
    applies_to: Order
    rule: test == false
    severity: block
    rationale: >
      test true means a test gateway or test mode placed the order. No money moved
      and no customer exists behind it. Exclude from every count, total and
      attribution; it cannot be cancelled or refunded in any meaningful sense.
    owner: ecommerce@stella.example
    tags: [revenue]

  - id: SH-002
    name: Cancelled orders net to zero
    applies_to: Order
    rule: cancelled_at == null
    severity: block
    rationale: >
      A cancelled order was either never paid or paid and refunded in full, so
      its net revenue is zero and its line items never shipped. It is not a sale
      to attribute, and it cannot be cancelled or refunded again.
    owner: ecommerce@stella.example
    tags: [revenue]

  - id: SH-003
    name: Payment not yet captured
    applies_to: Order
    rule: financial_status != "pending" && financial_status != "authorized"
    severity: info
    rationale: >
      pending (cash on delivery, bank transfer, manual payment) and authorized
      (card reserved, not captured) orders count as sales in Shopify reports at
      processed_at but may never be paid. Quote them as booked, not collected.
    owner: ecommerce@stella.example
    tags: [revenue]

  - id: SH-004
    name: Paid in another currency
    applies_to: Order
    rule: presentment_currency == currency
    severity: info
    rationale: >
      total_price and every plain money field are the shop-currency conversion at
      order time. The customer paid presentment_money in presentment_currency.
      Ad platforms report spend in their account currency; say which currency a
      ROAS mixes.
    owner: ecommerce@stella.example
    tags: [revenue]

  - id: SH-005
    name: Imported or back-dated order
    applies_to: Order
    rule: processed_at == created_at
    severity: info
    rationale: >
      processed_at normally equals created_at. When they differ the order was
      imported or its date was set by an app, and reports book it at
      processed_at. Daily series that use created_at will not reconcile with
      Shopify's.
    owner: ecommerce@stella.example
    tags: [revenue]

  - id: SH-006
    name: Order has refunds
    applies_to: Order
    rule: financial_status != "partially_refunded" && financial_status != "refunded"
    severity: info
    rationale: >
      Count the sale at the order's processed_at and the return at each Refund's
      processed_at, or use current_total_price as the net; using
      current_total_price and also subtracting Refunds counts the return twice.
    owner: ecommerce@stella.example
    tags: [revenue]

  - id: SH-007
    name: Gift card purchases are not sales
    applies_to: LineItem
    rule: gift_card == false
    severity: warn
    rationale: >
      Buying a gift card creates a liability; Shopify excludes it from total sales
      and counts the sale when the card is redeemed. Including it double counts
      when the redemption order is also counted.
    owner: ecommerce@stella.example
    tags: [revenue]
