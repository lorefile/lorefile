constraints:
  - id: GA-011
    name: Use a live client account
    applies_to: Account
    rule: manager == false && test_account == false
    severity: block
    rationale: >
      A manager account (MCC) holds no campaigns; query the client customer_id
      with the manager as login customer. A test account serves nothing and its
      metrics are synthetic.
    owner: measurement@yourcompany.example

  - id: GA-012
    name: Campaigns in a running experiment are frozen
    applies_to: Campaign
    rule: in_active_experiment == false && experiment_type == "BASE"
    severity: block
    rationale: >
      Pausing, re-budgeting or re-targeting a test cell mid-flight changes the
      treatment and voids the read-out. This covers our geo experiments and lift
      tests (in_active_experiment) and Google's own campaign experiments
      (experiment_type EXPERIMENT or DRAFT), which are edited through the
      experiment, not the arm.
    owner: measurement@yourcompany.example
    tags: [experiment]

  - id: GA-013
    name: Only an enabled campaign can be paused
    applies_to: pause_campaign
    rule: campaign.status == "ENABLED"
    severity: block
    rationale: Pausing a PAUSED or REMOVED campaign does nothing; the request is aimed at the wrong campaign.
    owner: measurement@yourcompany.example

  - id: GA-014
    name: Shared budgets are changed on the budget
    applies_to: change_budget
    rule: campaign.budget_explicitly_shared == true implies change.scope == "shared_budget"
    severity: block
    rationale: >
      When campaign_budget.explicitly_shared is true the amount belongs to a
      budget shared by several campaigns. Changing it changes all of them; the
      change must be scoped and approved as such.
    owner: measurement@yourcompany.example
    tags: [budget]

  - id: GA-015
    name: Budget changes over 20% unsettle Smart Bidding
    applies_to: change_budget
    rule: double(change.new_amount_micros) * 10.0 <= double(change.current_amount_micros) * 12.0 && double(change.new_amount_micros) * 10.0 >= double(change.current_amount_micros) * 8.0
    severity: warn
    rationale: >
      A large budget change puts the strategy into LEARNING_BUDGET_CHANGE for
      days. The 20% step is our working rule, not a Google number; step bigger
      changes over several days.
    owner: measurement@yourcompany.example
    tags: [budget]

  - id: GA-016
    name: Only Smart Bidding campaigns have that target
    applies_to: change_bid_target
    rule: "change.target_type == \"target_cpa\" ? campaign.bidding_strategy_type in [\"TARGET_CPA\", \"MAXIMIZE_CONVERSIONS\"] : campaign.bidding_strategy_type in [\"TARGET_ROAS\", \"MAXIMIZE_CONVERSION_VALUE\"]"
    severity: block
    rationale: >
      A tCPA lives on TARGET_CPA or MAXIMIZE_CONVERSIONS strategies, a tROAS on
      TARGET_ROAS or MAXIMIZE_CONVERSION_VALUE. Any other strategy has no such
      target. Keep target changes within about 20% a step: a jump restarts
      learning and a tCPA far below the real CPA throttles delivery.
    owner: measurement@yourcompany.example
    tags: [bidding]
