constraints:
  - id: SC-060
    name: No safety-critical parts from high-risk countries
    applies_to: supplies
    rule: part.safety_critical == true implies supplier.country_risk != "high"
    severity: block
    rationale: Board policy RP-2024-03 after the 2024 port closures.
    owner: risk@acme.example
    tags: [risk]

  - id: SC-061
    name: Spend concentration cap
    applies_to: Supplier
    rule: annual_spend_usd <= 25000000.0
    severity: warn
    rationale: No single supplier should hold more than $25M of annual spend without a dual-source plan.
    owner: cfo-office@acme.example

  - id: SC-062
    name: Approved status required
    applies_to: Supplier
    rule: status == "approved"
    severity: warn
    rationale: Suppliers on probation can keep existing business but new awards need Quality sign-off.

  - id: SC-063
    name: Safety-critical parts need IATF 16949
    applies_to: supplies
    rule: part.safety_critical == true implies supplier.iatf_certified == true
    severity: block
    rationale: Customer PPAP requirements; uncertified suppliers fail the audit trail.
    owner: quality@acme.example
    tags: [safety, compliance]
