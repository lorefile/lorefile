name: northstar-saas-pricing
version: 0.1.0
description: >
  Northstar Analytics sells a product-analytics platform on four plans, from a
  free tier to enterprise contracts. This ontology is what our billing, sales
  and support agents read before they change a plan, apply a discount, add
  seats or issue a credit.
domains:
  - name: Accounts & contracts
    description: Who the customer is and what paper governs the relationship.
    types: [Account, Contract]
  - name: Plans & subscriptions
    description: What we sell, what each account is on, and who has a seat.
    types: [Plan, Subscription, Seat]
  - name: Features & usage
    description: What a subscription is allowed to use, and how much it did.
    types: [Feature, Entitlement, Usage]
  - name: Billing
    description: Invoices and the discounts that shape them.
    types: [Invoice, Discount]
