<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Lorefile</title>
<style>
/* ==================== 1. tokens (specs/2026-11-28-design-system.md, Part 2) ====================
   Every colour, size, corner and shadow below this block is a var(--…). tests/ui_tokens.rs checks it. */
:root{
  /* ---- colour: ground and ink ---- */
  --paper:#FAF7F0;          /* page background */
  --card:#FFFDF8;           /* panels, inputs, the reading column's raised parts */
  --ink:#1F1B16;            /* text: 16.0:1 on paper */
  --ink-2:#5C544A;          /* second text, labels, hints: 6.95:1 on paper, 7.32:1 on card */
  --rule:#E4DCCB;           /* hairlines between things (decorative, not for controls) */
  --rule-strong:#8F8573;    /* borders of anything you type in or choose from: 3.40:1 on paper */
  --tint:#F3EEE3;           /* hover on rows */

  /* ---- colour: the one accent ---- */
  --accent:#8C2F1B;         /* oxblood: primary buttons, links, selection, focus. 7.73:1 on paper; white on it 8.28:1 */
  --accent-press:#6E2414;   /* pressed and hover of primary */
  --accent-soft:#F6E7E1;    /* "you are here" background. Accent text on it 6.87:1 */
  --on-accent:#FFFFFF;      /* text on an --accent fill */

  /* ---- colour: status (each also differs in lightness or carries a glyph, never hue alone) ---- */
  --ok:#2F6B3A;             /* checked, valid, a person stands behind it: 5.97:1 */
  --warn:#8A5200;           /* look at it, not described, needs words: 5.97:1; 5.40:1 on --warn-soft */
  --warn-soft:#F5EBD6;
  --stop:#A3231A;           /* wrong, error, a guardrail that stops: 6.98:1 */
  --stop-soft:#F8E4E0;
  --accepted:#2B4C7E;       /* the "accepted" stamp only: 8.05:1 */
  --agent:#5C544A;          /* the "agent wrote · not reviewed" stamp: pencil grey (= --ink-2) */

  /* ---- colour: areas (the drawing, area labels; never used for status) ---- */
  --area-1:#3F4A9E;  /* indigo   7.31:1 */
  --area-2:#1F6F68;  /* teal     5.56:1 */
  --area-3:#7B3B7E;  /* plum     7.09:1 */
  --area-4:#586B1F;  /* olive    5.55:1 */
  --area-5:#4A5563;  /* slate    7.08:1 */
  --area-6:#1F628F;  /* sky      6.13:1 */
  --area-7:#8E3A5E;  /* mulberry 6.73:1 */
  --area-8:#6B5434;  /* umber    6.67:1 */

  /* ---- colour: the drawing (Overview and Graph) ---- */
  --draw-ground:#F3EEE3; --draw-tile:#FFFDF8; --draw-edge:#8F8573; --draw-side-l:#ECE5D6; --draw-side-r:#E2D9C6;
  --draw-line:#B3A890; --draw-line-soft:#D6CCB6;
  --scrim:rgba(31,27,22,.22);   /* the flat --ink scrim behind the open jump list and dialogs */

  /* ---- type ---- */
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --fs-micro:11px;   /* small capitals: panel names, group labels, stamps */
  --fs-small:12px;   /* hints, tags, captions */
  --fs-ui:13px;      /* controls, menus, lists, tables */
  --fs-read:15px;    /* sentences people wrote: descriptions, field sentences, card text */
  --fs-title:20px;   /* card and section titles (serif) */
  --fs-h1:30px;      /* the page title (serif) */
  --lh-ui:1.4; --lh-read:1.6;
  --fw-normal:400; --fw-mid:500; --fw-strong:600;
  --caps-track:.08em;  /* letter-spacing of small capitals */

  /* ---- space: seven steps ---- */
  --sp-1:2px; --sp-2:4px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px; --sp-7:32px;
  --page-pad:24px;   /* 16px under 720 (see breakpoints) */

  /* ---- shape ---- */
  --r-stamp:3px; --r-control:4px; --r-card:6px; --r-round:999px;  /* round: count badges only */
  --hair:1px; --stamp-line:1.5px;

  /* ---- sizes ---- */
  --h-control:36px; --h-compact:30px; --h-touch:44px;
  --panel-head:36px; --rail:44px; --rail-menu:56px;
  --w-menu:220px; --w-index:200px; --w-notes:300px;
  --measure:720px;   /* the reading column never grows wider */
  --w-stamp:140px;   /* the margin where a statement's stamp sits */
  --h-header:48px; --h-footer:32px;

  /* ---- depth: two shadows ---- */
  --shadow-pop:0 8px 24px rgba(31,27,22,.12);    /* menus, the jump list, pickers, toasts */
  --shadow-modal:0 18px 50px rgba(31,27,22,.20);  /* dialogs, phone sheets */

  /* ---- layers ---- */
  --z-sticky:10; --z-pop:20; --z-drawer:30; --z-modal:40; --z-toast:50;

  /* ---- motion ---- */
  --ease:150ms ease;   /* none under prefers-reduced-motion */
}
@media (prefers-reduced-motion: reduce){:root{--ease:0s}}
/* Breakpoints, written as constants because CSS can't put a variable in @media (and once in JS, TIERS):
   phone < 720 · tablet 720–1023 · laptop 1024–1279 · desktop ≥ 1280. No other width appears in a media query. */

/* ==================== 2. base elements ==================== */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:var(--fw-normal) var(--fs-ui)/var(--lh-ui) var(--sans)}
a{color:var(--accent);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:var(--sp-2) var(--sp-4);border:var(--hair) solid var(--rule-strong);background:var(--card);border-radius:var(--r-control);cursor:pointer;min-height:var(--h-control);font-weight:var(--fw-mid)}
button:hover:not(:disabled){background:var(--tint)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:var(--fw-strong)}
button.primary:hover:not(:disabled){background:var(--accent-press);border-color:var(--accent-press)}
button.small{padding:0 var(--sp-3);min-height:var(--h-compact)}button.danger{color:var(--stop)}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{padding:var(--sp-3);border:var(--hair) solid var(--rule-strong);border-radius:var(--r-control);background:var(--card)}
input,select{min-height:var(--h-control);padding-top:0;padding-bottom:0}
input.need,textarea.need{background:var(--warn-soft);border-color:var(--warn)}
input:disabled,textarea:disabled,select:disabled{opacity:.6;background:var(--tint);cursor:default}
textarea{resize:vertical}
::placeholder{color:var(--ink-2);opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary:focus-visible,.chip.pick.on:focus-visible{box-shadow:inset 0 0 0 var(--sp-1) var(--card)}
h1{margin:0;font:var(--fw-strong) var(--fs-h1)/1.2 var(--serif)}h1 small{font:var(--fw-normal) var(--fs-ui)/var(--lh-ui) var(--sans);color:var(--ink-2);margin-left:var(--sp-3)}
h2{margin:0;font:var(--fw-strong) var(--fs-title)/1.3 var(--serif)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:var(--sp-2) var(--sp-3);border-bottom:var(--hair) solid var(--rule);vertical-align:top}th{color:var(--ink-2);font-weight:var(--fw-strong);font-size:var(--fs-small)}
.mono{font-family:var(--mono);font-size:var(--fs-ui)}code,pre{font-family:var(--mono);font-size:var(--fs-small)}
pre{margin:0;background:var(--card);border:var(--hair) solid var(--rule);border-radius:var(--r-card);padding:var(--sp-4);overflow:auto;white-space:pre-wrap;word-break:break-word}
code.block{display:block;background:var(--tint);border-radius:var(--r-control);padding:var(--sp-3) var(--sp-4);white-space:pre-wrap;word-break:break-word}

/* ==================== 3. layout: the shell and the four tiers (Part 5) ==================== */
#app{display:grid;grid-template-rows:var(--h-header) minmax(0,1fr) var(--h-footer);grid-template-columns:var(--w-menu) minmax(0,1fr);height:100vh;transition:grid-template-columns var(--ease)}
#app.navrail{grid-template-columns:var(--rail-menu) minmax(0,1fr)}
header{grid-column:1/3;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-4) 0 var(--sp-5);border-bottom:var(--hair) solid var(--rule);background:var(--card);flex-wrap:nowrap;min-width:0;overflow:hidden}
nav{border-right:var(--hair) solid var(--rule);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#view{display:flex;min-height:0;min-width:0;position:relative}
.main{flex:1 1 auto;min-width:0;overflow:auto;padding:var(--page-pad);display:flex;flex-direction:column;gap:var(--sp-4)}
.list{flex:0 0 var(--w-index);border-right:var(--hair) solid var(--rule);overflow:hidden;display:flex;flex-direction:column;gap:var(--sp-1);position:relative;transition:flex-basis var(--ease)}
.aside{flex:0 0 var(--w-notes);border-left:var(--hair) solid var(--rule);background:var(--card);overflow:hidden;display:flex;flex-direction:column;gap:var(--sp-4);position:relative;transition:flex-basis var(--ease)}
footer{grid-column:1/3;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-4) 0 var(--sp-5);border-top:var(--hair) solid var(--rule);background:var(--card);color:var(--ink-2);font-size:var(--fs-small);white-space:nowrap;overflow:hidden;min-width:0}
footer > *{flex:0 0 auto}footer .ft-git{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer .ft-state{display:inline-flex;align-items:center;gap:var(--sp-1)}footer .ft-push{flex:1 1 auto}footer button.lnk{min-height:var(--h-compact);font-weight:var(--fw-strong)}footer button.ft-git{font-weight:var(--fw-normal);color:var(--ink-2)}
/* nothing inside a scrolling column may shrink below its content (UI-07) */
.main > *, nav > *, .aside > *, .list > *, .panel-scroll > *, .nav-scroll > *{flex-shrink:0}
/* a panel's content sits in one wrapper, and folding hides that one element (UI-05) */
.panel-body{display:flex;flex-direction:column;min-width:0}
/* the inner edge of a panel can be dragged (or moved with the arrow keys) to make room to read */
nav{position:relative}
.resizer{position:absolute;top:0;bottom:0;width:8px;z-index:var(--z-sticky);cursor:col-resize;touch-action:none}
nav > .resizer,.list > .resizer{right:0}.aside > .resizer{left:0}
.resizer::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:transparent}
.resizer:hover::after,.resizer:focus-visible::after,.resizer.active::after{background:var(--accent)}
.resizer:focus-visible{outline:none}
#app.navfold nav > .resizer,#app.listfold .list > .resizer,#app.asidefold .aside > .resizer{display:none}
#app.resizing,#app.resizing .list,#app.resizing .aside{transition:none}#app.resizing{cursor:col-resize;user-select:none}
.list > .panel-body,.aside > .panel-body{flex:1 1 0;min-height:0}
/* folded panels become rails; on a tablet an opened rail becomes a drawer over the page */
#app.listfold .list{flex-basis:var(--rail)}#app.listfold .list > .panel-body{display:none}#app.listfold .list > .panel-rail{display:flex}
#app.asidefold .aside.foldable{flex-basis:var(--rail)}#app.asidefold .aside.foldable > .panel-body{display:none}#app.asidefold .aside.foldable > .panel-rail{display:flex}
#app.drawer-list .list,#app.drawer-aside .aside.foldable{overflow:visible;z-index:var(--z-drawer)}
#app.drawer-list .list > .panel-body,#app.drawer-aside .aside.foldable > .panel-body{display:flex;position:absolute;top:0;bottom:0;overflow:hidden;background:var(--card);box-shadow:var(--shadow-modal)}
#app.drawer-list .list > .panel-body{left:0;width:var(--w-index);border-right:var(--hair) solid var(--rule)}
#app.drawer-aside .aside.foldable > .panel-body{right:0;width:var(--w-notes);border-left:var(--hair) solid var(--rule)}
#app.drawer-list .list > .panel-rail,#app.drawer-aside .aside.foldable > .panel-rail{display:none}
#app.drawer-nav nav{position:fixed;left:0;top:var(--h-header);bottom:var(--h-footer);width:var(--w-menu);z-index:var(--z-drawer);background:var(--card);box-shadow:var(--shadow-modal)}
.phone-only,.phone-back{display:none}
@media (width >= 720px){.phone-only,.phone-back{display:none!important}}
@media (width < 720px){
  :root{--page-pad:16px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--h-header) 1fr var(--h-footer);height:auto;min-height:100vh}
  #app.navrail{grid-template-columns:minmax(0,1fr)}
  header{grid-column:1;padding:0 var(--sp-2)}
  nav{display:none}
  #app.drawer-nav nav{display:flex;position:fixed;inset:var(--h-header) 0 0 0;width:auto;z-index:var(--z-drawer)}
  #view{grid-column:1;flex-direction:column}
  .main{overflow:visible}
  .aside,.list{flex:0 0 auto;border:none}
  footer{grid-column:1;padding:0 var(--sp-4);min-height:var(--h-footer)}
  .phone-only{display:inline-flex}
  .phone-back{display:inline-flex;align-items:center;align-self:flex-start;min-height:var(--h-touch);font-weight:var(--fw-strong)}
  /* list and item are two steps on a phone (UI-17) */
  #view:has(> .list[data-at="list"]) > .main{display:none}
  #view > .list[data-at="item"]{display:none}
  .panel-btn,.panel-rail{display:none!important}
  #app .list,#app .aside{overflow:visible}
  #app .list > .panel-body,#app .aside > .panel-body{flex:none;min-height:auto}
  #app .panel-scroll{overflow:visible;flex:none}
  #app.drawer-nav nav .panel-btn{display:none!important}
  :root :is(button,input,select):not(.lnk){min-height:var(--h-touch)}
  /* a table that can't shrink scrolls in its own box, never the page (UI-14) */
  .main table,.pl-wrap table{display:block;overflow-x:auto;max-width:100%}
  .pl-table{display:block}.pl-table thead{display:none}.pl-table tbody{display:flex;flex-direction:column}
  .pl-table tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-1) var(--sp-3);padding:var(--sp-3) 0;border-bottom:var(--hair) solid var(--rule)}
  .pl-table td{display:block;border:none;padding:0}.pl-table td:nth-child(5){grid-column:1/-1}
}

/* ==================== 4. patterns ==================== */
/* every multi-line box is as tall as its text (UI-08); a JS fallback sets the height where field-sizing is missing */
.autogrow{field-sizing:content;min-height:calc(2lh + 18px);max-height:40vh;resize:none;overflow:auto}
textarea.yaml.autogrow{max-height:none}
.row{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--sp-2)}
.hint{font-size:var(--fs-small);color:var(--ink-2)}
.muted{color:var(--ink-2)}.small{font-size:var(--fs-small)}.strong{font-weight:var(--fw-strong)}.normal{font-weight:var(--fw-normal)}.push{margin-left:auto}.grow{flex:1 1 auto;min-width:0}.self-start{align-self:flex-start}.mt-1{margin-top:var(--sp-2)}.full-row{flex:1 1 100%}
.title-s{font:var(--fw-strong) var(--fs-read)/1.3 var(--serif)}
.pad{padding:var(--sp-2)}.indent{padding-left:calc(var(--sp-6) + var(--sp-1))}.pre-tall{min-height:200px}.w-mid{max-width:520px}.w-name{max-width:260px}.w-short{max-width:200px}.w-min{min-width:180px}.w-full{width:100%}.ta-left{text-align:left}
.is-hidden{display:none}.mt-2{margin-top:var(--sp-4)}.pt-2{padding-top:var(--sp-3)}.end{justify-content:flex-end}.center{align-items:center}.nowrap{white-space:nowrap}.pointer{cursor:pointer}.ink{color:var(--ink)}
.row.top{align-items:flex-start;gap:var(--sp-5)}
.kv{display:flex;gap:var(--sp-4);align-items:flex-start}.kv-k{color:var(--accent);width:124px;flex:0 0 auto}
.act-dot{flex:0 0 auto;width:8px;height:8px;border-radius:var(--r-round);margin-top:var(--sp-2)}.act-dot.agent{background:var(--warn)}.act-dot.person{background:var(--ok)}
.caps{font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:var(--caps-track);text-transform:uppercase;color:var(--ink-2)}
.desc{color:var(--ink-2);max-width:78ch}
.step-label{font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:var(--caps-track);text-transform:uppercase;color:var(--ink-2)}
nav h4,.aside h4,.main h4,.list h4,.pl-wrap h4{margin:var(--sp-4) 0 var(--sp-2);font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:var(--caps-track);text-transform:uppercase;color:var(--ink-2);padding:0}
nav h4{padding:0 var(--sp-3)}
.form{display:grid;grid-template-columns:150px 1fr;gap:var(--sp-3) var(--sp-4);align-items:center;max-width:var(--measure)}
.form label{font-size:var(--fs-small);font-weight:var(--fw-strong);color:var(--ink-2)}
.cmd{display:flex;gap:var(--sp-3);align-items:flex-start}.cmd code.block{flex:1 1 auto;min-width:0}.cmd button{flex:0 0 auto}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* the panel pattern (Part 6): one head, one fold button facing the reading column, one rail that is one button */
.panel-head{flex:0 0 var(--panel-head);height:var(--panel-head);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:0 var(--sp-1) 0 var(--sp-5);border-bottom:var(--hair) solid var(--rule)}
.aside .panel-head{justify-content:flex-start;padding:0 var(--sp-5) 0 var(--sp-1)}
.panel-name{font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:var(--caps-track);text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-btn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:36px;height:var(--h-compact);min-height:var(--h-compact);padding:0;border:none;background:transparent;color:var(--ink-2)}
button.panel-btn:hover:not(:disabled){background:var(--tint);color:var(--ink)}
.panel-rail{display:none;flex-direction:column;align-items:center;gap:var(--sp-4);flex:1 1 auto;width:100%;min-height:0;padding:calc((var(--panel-head) - var(--h-compact)) / 2) 0 0;border:none;border-radius:0;background:transparent;color:var(--ink-2);font-weight:var(--fw-strong)}
.panel-rail:hover:not(:disabled){background:var(--tint);color:var(--ink)}
.panel-rail .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:var(--fs-micro);letter-spacing:var(--caps-track);text-transform:uppercase;white-space:nowrap}
.panel-scroll{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-3)}
.aside .panel-scroll{padding:var(--sp-4) var(--sp-5);gap:var(--sp-4)}
.ic{width:18px;height:18px;flex:0 0 auto;vertical-align:-4px}.ic.sm{width:14px;height:14px;vertical-align:-2px}
kbd{display:inline-block;font:var(--fw-mid) var(--fs-micro)/1.4 var(--mono);border:var(--hair) solid var(--rule-strong);border-radius:var(--r-stamp);padding:0 var(--sp-2);color:var(--ink-2);background:var(--paper);white-space:nowrap}

/* the reading column (Part 5): centred, never wider than --measure; tables scroll in their own box */
.main.reading{padding:var(--sp-5) var(--page-pad) var(--sp-7);gap:var(--sp-4)}
.main.reading > *{width:100%;max-width:calc(var(--measure) + var(--w-stamp) + var(--sp-5));margin-inline:auto}
.scroll-x{overflow-x:auto;max-width:100%}.scroll-x td,.scroll-x th{white-space:nowrap}
/* the page head (Part 5): eyebrow, serif title, one sans sentence, tools at the right */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5);flex-wrap:wrap}
.ph-text{display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.ph-eyebrow{font-size:var(--fs-small);color:var(--ink-2);overflow-wrap:anywhere}
.ph-desc{color:var(--ink-2)}
.ph-tools{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
/* margin rows: a stamp slot, then the statement (Part 8, the field row). Under 720 px the stamp moves to the end of line 1 */
.lg{display:grid;grid-template-columns:var(--w-stamp) minmax(0,1fr);grid-template-areas:"stamp line" "stamp say";column-gap:var(--sp-5);row-gap:var(--sp-1);align-items:start}
.lg.no-line{grid-template-areas:"stamp say"}
.lg-stamp{grid-area:stamp;display:flex;padding-top:var(--sp-1);min-width:0}
.lg-line{grid-area:line;min-width:0}.lg-say{grid-area:say;min-width:0}
.lg-rows{display:flex;flex-direction:column}
.lg-rows > .lg{padding:var(--sp-3) 0;border-top:var(--hair) solid var(--rule)}
.lg-rows > .lg:last-child{border-bottom:var(--hair) solid var(--rule)}
.lg.flash{background:var(--accent-soft);transition:background var(--ease)}
.lg-intro{margin:var(--sp-2) 0 0}
.lg-h{padding:0!important;margin-top:var(--sp-5)!important}.lg-h .hint{text-transform:none;letter-spacing:0;font-weight:var(--fw-normal)}
.lg-after{display:flex;gap:var(--sp-3)}
.f-line{display:flex;align-items:baseline;gap:var(--sp-2) var(--sp-3);flex-wrap:wrap;line-height:1.5}
.f-name{font-family:var(--mono);font-size:var(--fs-ui);font-weight:var(--fw-mid)}
.f-kind{font-size:var(--fs-small);color:var(--ink-2)}.f-kind.more{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
button.lnk.g-name{font:var(--fw-strong) var(--fs-read)/1.4 var(--serif);color:var(--ink)}
/* a sentence people wrote: read as text, a pencil always beside it, click or Enter to edit in place (Part 8) */

.say-btn.unsaid{color:var(--warn);font-style:italic;border-bottom:var(--stamp-line) dashed var(--warn);padding-bottom:var(--sp-1)}.say-btn.unsaid .ic{color:var(--warn)}

.say-ro.none{color:var(--ink-2);font-style:italic}

.say-box:focus{outline:2px solid var(--accent);outline-offset:1px}

.label{display:block;font-size:var(--fs-small);font-weight:var(--fw-strong);color:var(--ink-2)}
.stack-form{display:flex;flex-direction:column;gap:var(--sp-2);max-width:420px}.stack-form .label{margin-top:var(--sp-2)}.stack-form .row{margin-top:var(--sp-3)}

/* Notes about an entity */

.aside .hint{margin:0}

/* ==================== 5. components ==================== */
/* buttons that read as text */

/* cards: only for something you pick up or act on as one thing */

.tag.caps{font-size:var(--fs-micro);letter-spacing:var(--caps-track);text-transform:uppercase}.tag.small{font-size:var(--fs-micro);padding:0 var(--sp-1)}

.stamp.changed{border-color:var(--warn);color:var(--warn)}
.stamp.accepted{border-color:var(--accepted);color:var(--accepted);box-shadow:inset 0 0 0 var(--sp-1) var(--paper),inset 0 0 0 calc(var(--sp-1) + var(--hair)) var(--accepted);padding:var(--sp-2) var(--sp-3)}
.stamp.checked{border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 0 var(--sp-1) var(--paper),inset 0 0 0 calc(var(--sp-1) + var(--hair)) var(--ok);padding:var(--sp-2) var(--sp-3)}

.stamp.big{transform:rotate(2deg)}
.stamp.small{padding:0 var(--sp-2);letter-spacing:.04em}.stamp.small.accepted,.stamp.small.checked{padding:var(--sp-1) var(--sp-2)}

.pill{display:inline-block;font-size:var(--fs-small);font-weight:var(--fw-strong);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-control);border:var(--hair) solid var(--rule);background:var(--paper);color:var(--ink-2)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.plain{color:var(--ink-2)}
.sev{display:inline-block;font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:var(--caps-track);text-transform:uppercase;padding:0 var(--sp-2);border-radius:var(--r-stamp);line-height:1.5}
.sev.block{background:var(--stop);color:var(--on-accent)}.sev.warn{background:var(--warn-soft);color:var(--warn)}.sev.info{background:var(--tint);color:var(--ink-2)}

.grade{display:inline-block;font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:var(--caps-track);text-transform:uppercase;padding:0 var(--sp-3);line-height:1.6;border-radius:var(--r-stamp);white-space:nowrap;border:var(--stamp-line) dashed var(--rule-strong);color:var(--ink-2)}
.grade.proposed{border-style:solid;border-color:var(--agent);color:var(--agent)}.grade.changed{border-style:solid;border-color:var(--warn);color:var(--warn)}.grade.accepted{border-style:double;border-width:3px;border-color:var(--accepted);color:var(--accepted)}.grade.checked{border-style:double;border-width:3px;border-color:var(--ok);color:var(--ok)}

.res{display:flex;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:var(--hair) solid var(--rule);align-items:flex-start}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4)}.banner.bad{background:var(--stop-soft);color:var(--stop)}

.hist .when{font-size:var(--fs-small);color:var(--ink-2);width:112px;flex:0 0 auto}.hist .chip{margin:0}.hist b{font-size:var(--fs-ui)}
.gline{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:center;line-height:1.5}.gline>span:last-child{min-width:0}.gline button{margin-left:var(--sp-2)}.gl-i{flex:0 0 auto;width:16px;text-align:center;color:var(--ink-2);font-weight:var(--fw-strong)}.gl-i.ok{color:var(--ok)}.gl-i.warn{color:var(--warn)}.gl-i.bad{color:var(--stop)}
.meaning{font-size:var(--fs-small);color:var(--ink-2)}.meaning summary{cursor:pointer;width:max-content}.meaning div{margin-top:var(--sp-1)}
.kinds-hint{font-size:var(--fs-small);margin-top:var(--sp-1)}
.card details>summary{cursor:pointer;font-size:var(--fs-small);color:var(--ink-2);width:max-content}.details{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-2)}.drow{display:grid;grid-template-columns:76px 1fr;gap:var(--sp-3);align-items:baseline}.drow pre{margin:0}
.namebox .row{align-items:center}
/* menus and popovers: plain rows on a card (UI-22) */
.h-menu{position:fixed;top:calc(var(--h-header) - var(--sp-1));right:var(--sp-4);z-index:var(--z-modal);background:var(--card);border:var(--hair) solid var(--rule);border-radius:var(--r-card);box-shadow:var(--shadow-pop);padding:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-1);min-width:170px}

.picker input{width:100%}.picker .pk-g{font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:var(--caps-track);text-transform:uppercase;color:var(--ink-2);padding:var(--sp-2) var(--sp-2) var(--sp-1)}
.picker .pk-o{display:flex;gap:var(--sp-3);align-items:center;text-align:left;background:transparent;border:none;border-radius:var(--r-control);padding:0 var(--sp-3);min-height:var(--h-compact);width:100%}
.picker .pk-o:hover,.picker .pk-o.on{background:var(--accent-soft)}.picker .pk-o small{margin-left:auto;color:var(--ink-2);font-size:var(--fs-small)}
.pk-save{border:var(--hair) solid var(--accent);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4);background:var(--accent-soft);display:flex;flex-direction:column;gap:var(--sp-2);max-width:520px}

/* ==================== 6. screens (only what is truly one-off) ==================== */
/* the header (Part 7): one line, 48 px, never wraps. Things shorten in a fixed order and never change position. */

.sp-name{font-weight:var(--fw-strong)}.sp-ver{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.hspace{flex:1 1 0;min-width:0}
.hpill{display:inline-flex;align-items:center;height:var(--h-compact);padding:0 var(--sp-3);border:var(--hair) solid var(--rule-strong);border-radius:var(--r-control);font-size:var(--fs-small);color:var(--ink-2);background:var(--paper);white-space:nowrap;flex:0 0 auto}
.hpill .short{display:none}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:var(--h-compact);min-height:var(--h-compact);min-width:var(--h-compact);padding:0 var(--sp-2);flex:0 0 auto}
/* the jump search: closed it is a box; open, a 2 px ring, a scrim behind the page, and an index of hits under it */
.jump{flex:0 1 560px;min-width:320px;display:flex;flex-direction:column}

.jump-clear,.jump-cancel{display:none}
.jump-scrim{position:fixed;inset:var(--h-header) 0 0 0;background:var(--scrim);z-index:var(--z-pop)}
.jump-list{position:fixed;z-index:var(--z-modal);background:var(--card);border:var(--hair) solid var(--rule);border-radius:var(--r-card);box-shadow:var(--shadow-pop);max-height:calc(100vh - var(--h-header) - var(--sp-7));overflow:auto;display:flex;flex-direction:column;color:var(--ink)}
.jump-list[hidden]{display:none}

<body>
<div id="app">
  <header>
    <button type="button" class="hbtn phone-only" id="h-menubtn" aria-controls="nav" aria-expanded="false" onclick="setPanel('nav', DRAWER === 'nav')"><svg class="ic" aria-hidden="true"><use href="#g-menu"/></svg>Menu</button>
    <a class="brand" href="#home" onclick="event.preventDefault();go('home')" aria-label="Lorefile: Home" title="Home"><svg class="ic" aria-hidden="true"><use href="#g-book"/></svg><span class="wordmark">Lorefile</span></a>
    <label class="spacepick" title="Which space (ontology) to show"><span class="sp-name" id="h-sp-name">…</span><span class="sp-ver" id="h-sp-ver"></span><svg class="ic sm" aria-hidden="true"><use href="#g-chevron-down"/></svg><select id="h-space" aria-label="Which space (ontology) to show" onchange="switchSpace(this.value)"></select></label>
    <div id="jump" class="jump" role="search">
      <div class="jump-top">
        <div class="jump-box"><svg class="ic" aria-hidden="true"><use href="#g-search"/></svg><input id="jump-q" type="text" role="combobox" aria-expanded="false" aria-controls="jump-list" aria-autocomplete="list" aria-label="Find or jump to" placeholder="Find or jump to…" autocomplete="off" spellcheck="false" onfocus="jumpOpen()" oninput="jumpInput(this.value)" onkeydown="jumpKeys(event)"><button type="button" class="jump-clear" aria-label="Clear the search" onclick="jumpClear()"><svg class="ic sm" aria-hidden="true"><use href="#g-close"/></svg></button><kbd class="jump-key" id="jump-key">Ctrl K</kbd></div>
        <button type="button" class="jump-cancel lnk" onclick="jumpClose()">Cancel</button>
      </div>
      <div id="jump-list" class="jump-list" role="listbox" aria-label="Results" hidden></div>
      <div id="jump-live" class="sr" aria-live="polite"></div>
    </div>
    <span class="hspace"></span>
    <span id="h-mode" class="hpill"></span>
    <button type="button" class="hbtn phone-only" id="h-search" aria-label="Find or jump to" onclick="jumpOpen(true)"><svg class="ic" aria-hidden="true"><use href="#g-search"/></svg></button>
    <button type="button" class="hbtn" id="h-more" aria-expanded="false" aria-haspopup="true" aria-controls="h-menu" aria-label="More: Reload, Summary.md, Connect an agent" onclick="headerMenu()"><svg class="ic" aria-hidden="true"><use href="#g-more"/></svg></button>
    <div class="menu h-menu" id="h-menu" hidden></div>
  </header>
  <div id="jump-scrim" class="jump-scrim" hidden onclick="jumpClose()"></div>
  <nav id="nav"></nav>
  <div id="view"></div>
  <footer id="footer"></footer>
</div>
<script>
// ---------- state ----------
let O = null, PR = { proposals: [], activity: [] }, DC = {}, TOOLS = null, TEMPLATES = null, TABLES = null, SPACES = null, AUTH = null;
// which space this page shows: /s/<id>/… ; B prefixes every API call so each space has its own URLs
const SP = (location.pathname.match(/^\/s\/([^/]+)/) || [])[1] || null;
const SPACE = SP ? decodeURIComponent(SP) : null;
const B = SP ? '/s/' + SP : '';
const spaceUrl = (id, hash) => '/s/' + encodeURIComponent(id) + '/' + (hash || '#home');
let route = { screen: 'home', arg: '' };
const ui = { mapSel: null, typeTab: 'fields', ruleFilter: 'all', ruleQuery: '', search: '', lf: { from: '', name: '', to: '', card: 'many-to-one', desc: '' }, rf: { name: '', applies: '', field: '', op: '==', value: '', rule: '', sev: 'block', why: '', who: '' }, tryInputs: {}, tryResult: null, sql: "select n.name, n.source_kind, count(c.id) as rules\nfrom nodes n left join constraints c on c.applies_to = n.name\ngroup by all order by rules desc", sqlOut: null, editor: null, newType: null, showProposal: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// a value written into a click handler is a JS string inside an HTML attribute, and the browser undoes the HTML
// escaping before it runs the script: so it is written as a JSON string first, then escaped. Never '${esc(x)}' there.
const jq = (s) => esc(JSON.stringify(String(s ?? '')));
// the same rule the server applies to a name (trust::by_words): a short plain name that never reads as an agent
const nameOk = (n) => n.length <= 60 && /^[\p{L}\p{N} .'_-]+$/u.test(n) && !/agent/i.test(n) && !n.toLowerCase().split(/\s+/).includes('via');
const NAME_RULE = 'Use up to 60 letters, digits, spaces and . - \' _ (no "agent" or "via"): the name is what history and trust.yaml will say.';
// a 401 means the sign-in went away (a new token, or signed out elsewhere): load again and the server shows its login screen
const api = async (p, opt) => { const r = await fetch(p, opt); if (r.status === 401) { signedOut(); return new Promise(() => {}); } return r.json(); };
// the sign-in went away (a new token, signed out elsewhere, a tunnel's session ended): say so and let the person choose when
let SIGNED_OUT = false;
function signedOut(){
  if (SIGNED_OUT) return; SIGNED_OUT = true;
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'so-title');
  el.innerHTML = `<div class="card"><b class="title-s" id="so-title">Your sign-in has ended</b><div>The server asked for the login again: a new token, a sign-out somewhere else, or the tunnel's session ended. Anything you were saving just now was not saved; copy it first if you need it.</div><div class="row end"><button class="primary" onclick="location.reload()">Sign in again</button></div></div>`;
  document.body.appendChild(el); const b = el.querySelector('button'); if (b) b.focus();
}
// the name, kept in this browser (Settings › Your name, the sign-in page, or the first decision), rides along with every
// write: "Priya via page" in history and trust.yaml. Where the browser keeps nothing, it lives in memory for the tab.
let MEM_NAME = '';
const ME = () => { try { return localStorage.getItem('lorefile-name') || MEM_NAME; } catch (e) { return MEM_NAME; } };
function setMe(v){ MEM_NAME = v || ''; try { if (v) localStorage.setItem('lorefile-name', v); else localStorage.removeItem('lorefile-name'); } catch (e) {} }
// every decision from the page waits for a name (the server still takes none, from scripts and older pages)
const nameReady = () => { const n = ME(); return !!n && nameOk(n); };
// a button that needs a name keeps its real label while it can't be used, and says why beside it: a quiet link that
// takes you to the name box (UI-12). {n} is the name ("Accept as Priya"); with no name yet it reads "Accept as you".
const nameLabel = (label, ok) => label.replace('{n}', ok ? ME() : 'you');
const nameHint = (wait) => String(wait || '').replace(/^Type your name( first)?/, 'Add your name') || 'Add your name';
const nameBtn = (label, wait, js, cls, off) => { const ok = nameReady(); return `<button class="${cls || 'small'}" data-needs-name data-label="${esc(label)}" ${off ? 'data-off' : ''} ${!ok || off ? 'disabled' : ''} onclick="${js}">${esc(nameLabel(label, ok))}</button><button type="button" class="lnk quiet" data-name-hint ${ok ? 'hidden' : ''} onclick="focusName()">${esc(nameHint(wait))}</button>`; };
function syncNameButtons(){ const ok = nameReady(); document.querySelectorAll('[data-needs-name]').forEach(b => { b.disabled = !ok || b.hasAttribute('data-off'); b.textContent = nameLabel(b.dataset.label, ok); }); document.querySelectorAll('[data-name-hint]').forEach(e => { e.hidden = ok; }); }
function nameBoxHtml(id){
  const me = ME();
  return `<div class="rv-q namebox"><label for="${id}"><b>Your name</b> <span class="hint">kept in this browser, recorded with every decision</span></label><div class="row"><input id="${id}" value="${esc(me)}" placeholder="e.g. Vinay" class="w-name" autocomplete="name" list="people-names" oninput="nameTyped(this)">${peopleDatalist()}${me ? `<button type="button" class="lnk" onclick="notMe(${jq(id)})">not you?</button>` : ''}</div><div class="name-err"></div>${AUTH && !AUTH.required ? '<div class="hint">This server runs with --no-auth: anyone who can reach it can type any name.</div>' : ''}</div>`;
}
// this space's people, as suggestions for "Your name": persons who haven't left
function peopleDatalist(){ const ps = ((typeof PEOPLE !== 'undefined' && PEOPLE && PEOPLE.people) || []).filter(p => p.kind === 'person' && !p.left); return ps.length ? `<datalist id="people-names">${ps.map(p => `<option value="${esc(p.name)}"></option>`).join('')}</datalist>` : ''; }
// typing another spelling of someone offers the main one
function spellingHint(v){ const p = v && typeof personOf === 'function' ? personOf(v) : null; return p && p.name !== v && p.kind === 'person' ? `<div class="hint">Another spelling of <b>${esc(p.name)}</b>. <button type="button" class="lnk" onclick="const b=this.closest('.namebox, .card').querySelector('input');b.value=${jq(p.name)};b.dispatchEvent(new Event('input'))">Use ${esc(p.name)}</button></div>` : ''; }
function nameTyped(el){
  const v = el.value.trim(), err = el.closest('.namebox').querySelector('.name-err');
  if (v && !nameOk(v)) { err.innerHTML = `<div class="d error">✗ That name cannot be used. ${esc(NAME_RULE)}</div>`; setMe(''); }
  else { err.innerHTML = spellingHint(v); setMe(v); }
  syncNameButtons();
}
function notMe(id){ setMe(''); const b = $(id); if (b) { b.value = ''; nameTyped(b); b.focus(); } }
// a name box for screens whose decisions sit on cards, shown only while no name is known
const nameBar = () => !ro() && !shipped() && !nameReady() ? `<div class="card">${nameBoxHtml('nb-name')}</div>` : '';
function decideName(){
  if (nameReady()) return ME();
  const b = document.querySelector('.namebox input');
  if (b) { note('Type your name first: it is recorded with every decision.', true); b.focus(); return null; }
  // no box on this screen (Vouch for all under What to do next): ask once
  const v = (prompt('Your name, recorded with this decision (kept in this browser)') || '').trim();
  if (!v) return null;
  if (!nameOk(v)) { note('That name cannot be used. ' + NAME_RULE, true); return null; }
  setMe(v); return v;
}
const post = (p, body) => api(p, { method:'POST', headers:{'Content-Type':'application/json', 'X-Lorefile':'write'}, body: JSON.stringify(ME() && body && typeof body === 'object' && !Array.isArray(body) ? Object.assign({ by: ME() }, body) : body) });
// --- grades: who stands behind each definition (trust.yaml) ---
const TR = (kind, name) => ((O.trust && O.trust.items) || []).find(x => x.kind === kind && x.name === name) || { grade: 'ungraded' };
const shortDate = (at) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(at || ''); return m ? `${Number(m[3])} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2]) - 1]}` : (at || ''); };
const whoSaid = (by) => { const n = String(by || '').split(' via ')[0].trim(); return !n || n === 'person' ? 'a person' : (n === 'agent' ? 'an agent' : n); };
// a grade, wherever it shows: the stamp (design system Part 9). Its aria-label and title carry the full sentence.
function gradeChip(kind, name){ return stamp(TR(kind, name), { small: true, oneLine: true }); }
// "Vinay" from "Vinay via page"; a decision made with no name says so
const anonBy = (by) => whoSaid(by) === 'a person';
const whoWords = (by) => anonBy(by) ? 'a person (no name was given)' : whoSaid(by);
const agentWho = (by) => { const a = agentOf(by); return a === 'An agent' ? 'an agent' : a; };
const labelOf = (n) => /[a-z]/.test(String(n || '')) ? human(snake(n)) : String(n || '');
const kindName = (k, n) => k === 'binding' ? `the source of ${n}` : k === 'term' ? `the also-called word “${n}”` : `${k} ${n}`;
// the line under a definition: its stamp, what was compared (for a checked one), and the buttons a person can use
function gradeLine(kind, name){
  const t = TR(kind, name);
  const note = t.grade === 'checked' && t.note && !t.changed_since ? `<span class="hint">“${esc(t.note)}”</span>` : '';
  const acts = gradeActs(kind, name);
  return `<div class="gline">${stamp(t, { small: true, oneLine: true })}${note}${acts ? `<span class="gr-act">${acts}</span>` : ''}</div>`;
}
const gradeMeaning = () => `<details class="meaning"><summary>What do the stamps mean?</summary><div><b>Accepted</b>: a person stands behind it, and agents use it as settled.</div><div><b>Checked against rows</b> (optional): someone ran it against real rows and the result was right.</div><div><b>Agent wrote · not reviewed</b>: an agent wrote it and no person has looked; agents say so.</div><div><b>Ungraded</b>: nobody has said who stands behind it yet.</div></details>`;
// the small buttons beside a chip where there is no room for a line (an also-called word on an entity)
function gradeButtons(kind, name){ return gradeActs(kind, name); }
async function looksRight(kind, name){ if (!decideName()) return; const r = await post(B + '/api/trust', { op: 'accept', kind, name }); await afterWrite({ ...r, summary: r.written ? `Accepted ${kindName(kind, name)}` : undefined }); }
async function signGrade(kind, name){ if (!decideName()) return; const r = await post(B + '/api/trust', { op: 'sign', kind, name }); await afterWrite(r); }
function openCheck(kind, name){ const sources = (O.sources || []).map(s => s.connection); ui.check = { kind, name, against: (ui.check && ui.check.against) || sources[0] || '', note: '' }; renderSheet(); }
function renderSheet(){
  let el = $('sheet'); if (!ui.check) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheet'; document.body.appendChild(el); }
  const c = ui.check; const what = c.kind === 'binding' ? `${labelOf(c.name)}’s source` : c.kind === 'metric' ? labelOf(c.name) : `${c.kind} ${c.name}`;
  el.innerHTML = `<div class="card"><b class="title-s">You compared ${esc(what)} with real numbers</b><div>Optional: accepted is all agents need. This records that you ran it against real rows and the result was right. Lorefile records your word; it does not run anything.</div><div class="form"><label>Against which source</label><select id="ck-against">${(O.sources || []).map(s => `<option ${s.connection===c.against?'selected':''}>${esc(s.connection)}</option>`).join('')}</select><label>What did you compare</label><textarea id="ck-note" class="autogrow" rows="2" placeholder="e.g. 412 paid orders for 16–22 Nov, the same as Shopify's own report">${esc(c.note)}</textarea></div>${nameBoxHtml('ck-name')}<div id="ck-err"></div><div class="row end"><button onclick="ui.check=null;renderSheet()">Cancel</button>${nameBtn('Mark as checked', 'Type your name to mark it', 'saveCheck()', 'primary')}</div></div>`;
}
async function saveCheck(){

  // closed first: the save draws the screen again, and it should show the new owner
  ui.pick = null; PEOPLE_AT = 0;
  const r = await patch({ op: 'set_owner', kind: p.kind, name: p.name, owner: p.removing ? '' : p.chosen });
  if (!r || !r.written) { ui.pick = p; rePick(); }
}

    const ren = ui.pp.renaming === p.name ? `<div class="also"><div class="row"><label for="pp-to">Rename ${esc(p.name)} to</label><input id="pp-to" value="${esc(ui.pp.to)}" placeholder="e.g. Vinay Karode" oninput="planRename(${jq(p.name)}, this.value)" class="w-name"><button class="small" onclick="ui.pp.renaming=null;renderPeopleAgain()">Cancel</button></div>${ui.pp.plan ? (ui.pp.plan.error ? `<div class="d error">✗ ${esc(ui.pp.plan.error)}</div>` : `<div>${ui.pp.plan.merge ? `Merge ${esc(ui.pp.plan.from)} into ${esc(ui.pp.plan.to)}` : `Rename ${esc(ui.pp.plan.from)} to ${esc(ui.pp.plan.to)}`}: ${esc(ui.pp.plan.counts_words)}. History and trust.yaml stay as written.</div>${(ui.pp.plan.lossy || []).length ? `<div class="hint">${esc(ui.pp.plan.lossy.join(', '))} ${ui.pp.plan.lossy.length === 1 ? 'is' : 'are'} rewritten whole and will lose ${ui.pp.plan.lossy.length === 1 ? 'its' : 'their'} comments (owners written inside { … }).</div>` : ''}<div><button class="small primary" onclick="peopleDo({op:'rename',from:${jq(ui.pp.plan.from)},to:${jq(ui.pp.to.trim())}})">${ui.pp.plan.merge ? 'Merge' : 'Rename'}</button></div>`) : ''}</div>` : '';

  }).join('');
  const same = (P.same_person || []).map(([a, b]) => `<div class="card row-card"><span>Same person? “${esc(a)}” and “${esc(b)}”</span>${editable ? `<button class="small" onclick="peopleDo({op:'rename',from:${jq(a)},to:${jq(b)}})">Yes, merge</button><button class="small" onclick="peopleDo({op:'not_same',name:${jq(a)},other:${jq(b)}})">No, two people</button>` : ''}</div>`).join('');

async function giveOwners(){

// ---------- areas: the card on Overview, the entity's "Move…", the new-entity form's "+ New area" (Part 3) ----------

async function areaOp(body, then){ const r = await patch(body); if (r && r.written) { ui.area = null; await loadPlane(true); if (then) then(r); else renderPlaneScreen(); } return r; }

  const listed = !!a.listed, ents = areaEntities(name), col = domainColor(name);
  const named = (O.domains || []).find(x => x.name === name), colourName = named && named.color && AREA_COLORS[named.color] ? named.color : '';

      <label class="sr" for="ar-desc">What the area holds</label><textarea id="ar-desc" class="autogrow" rows="2" placeholder="What belongs here, in plain words">${esc(a.description || '')}</textarea><div><button class="small" onclick="areaOp({op:'describe_area',area:${jq(name)},text:$('ar-desc').value},()=>{pl.sel='area:'+${jq(name)};renderPlaneScreen()})">Save the words</button></div>` : (a.description ? `<div>${esc(a.description)}</div>` : '')}

    ${ed ? (move ? `<div class="hint">Move here: pick up to 40.</div><div class="movelist">${others.length ? others.map(e => `<label class="chk"><input type="checkbox" ${ui.area.pick && ui.area.pick[e.name] ? 'checked' : ''} onchange="ui.area.pick[${jq(e.name)}]=this.checked"> ${esc(e.label)} <span class="hint">${esc(e.area)}</span></label>`).join('') : '<div class="hint">Every entity is here already.</div>'}</div><div class="row"><button class="small primary" onclick="moveHere(${jq(name)})">Move them here</button><button class="small" onclick="ui.area=null;planeAside()">Cancel</button></div>` : `<div class="row"><button class="small" onclick="ui.area={moving:${jq(name)},pick:{}};planeAside()">Move here…</button>

async function moveHere(area){
  const names = Object.entries((ui.area && ui.area.pick) || {}).filter(([, v]) => v).map(([k]) => k).slice(0, 40);
  if (!names.length) { note('Pick at least one entity.', true); return; }
  await areaOp({ ops: names.map(n => ({ op: 'move_to_area', type: n, area })) }, () => { pl.sel = 'area:' + area; renderPlaneScreen(); });
}
async function reorderArea(name, by){
  const order = (O.manifest.domains || []).map(d => d.name), i = order.indexOf(name), j = i + by;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  await areaOp({ op: 'order_areas', order }, () => { pl.sel = 'area:' + name; renderPlaneScreen(); });
}

async function moveTo(name, area, where){

async function createSpace(){

// --- sources ---
function renderSources(v){
  const f = facts();
  const readable = (k) => ['csv', 'parquet', 'duckdb'].includes(String(k).toLowerCase());
  const rows = (O.sources||[]).map(s => {
    const used = f.types.filter(t => t.source_connection === s.connection).map(t => t.name).concat(f.metrics.filter(m => (m.source && m.source.connection === s.connection) || (m.variants||[]).some(x => x.source.connection === s.connection)).map(m => 'metric ' + m.name), f.fns.filter(fn => fn.runs && fn.runs.kind === 'mcp' && (fn.runs.server === s.connection || fn.runs.server === s.server)).map(fn => 'function ' + fn.name));
    const where = s.kind === 'from_user' ? 'files people give agents' : (readable(s.kind) ? 'readable here' : 'declared · agents fetch rows');

// --- history ---
function when(iso){
  const d = new Date(iso); if (isNaN(d)) return iso || '';
  const now = new Date(), day = (x) => x.toDateString(), hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (day(d) === day(now)) return 'today ' + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (day(d) === day(y)) return 'yesterday ' + hm;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ' ' + hm;
}
// git's unified diff, in the inbox card's colours: a file name, then + and - lines
function gitDiffHtml(text){
  if (!(text || '').trim()) return '(no file in this space changed)';
  const out = [];
  for (const l of text.replace(/\n$/, '').split('\n')) {
    const f = l.match(/^diff --git a\/(.*) b\/(.*)$/);
    if (f) { out.push({ cls: 'file', text: f[2] }); continue; }
    if (/^new file mode/.test(l)) { const last = out[out.length - 1]; if (last && last.cls === 'file') last.text += ' (new)'; continue; }
    if (/^deleted file mode/.test(l)) { const last = out[out.length - 1]; if (last && last.cls === 'file') last.text += ' (removed)'; continue; }
    if (/^(index |--- |\+\+\+ |old mode|new mode|similarity|rename |Binary files)/.test(l)) continue;
    if (l.startsWith('@@')) { out.push({ cls: 'hunk', text: l.replace(/^(@@[^@]*@@).*$/, '$1') }); continue; }
    out.push({ cls: l[0] === '+' ? 'add' : (l[0] === '-' ? 'del' : ''), text: l });
  }
  return out.map(x => `<div class="${x.cls}">${esc(x.text)}</div>`).join('');
}

async function runTry(name){

function localWhen(iso){
  const t = new Date(iso); if (!iso || isNaN(t)) return '';

  const diff = Math.round((day(new Date()) - day(t)) / 86400000);
  if (diff === 0) return 'today ' + time;
  if (diff === 1) return 'yesterday ' + time;

  const undo = (r.notes || []).find(n => n.kind === 'undo');
  const removes = (r.changes || []).filter(x => x.op === 'remove');
  const anonDecision = (r.status === 'accepted' && (!d.accepted_by || d.accepted_by === 'a person')) || (r.status === 'set_aside' && (!d.decided_by || d.decided_by === 'a person'));
  const decidable = (r.status === 'pending' && (can.accept || can.dismiss)) || (r.status === 'set_aside' && can.reopen) || (r.status === 'accepted' && r.take_back && r.take_back.possible) || !!can.sign;

    const whyBox = ui.rv.why !== null ? `<div class="rv-q"><label for="rv-why"><b>Why?</b> <span class="hint">(optional; the agent sees this)</span></label><textarea id="rv-why" class="autogrow w-mid" rows="2" oninput="ui.rv.why=this.value">${esc(ui.rv.why || '')}</textarea><div class="row">${nameBtn('Set aside', 'Type your name to set aside', `dismissP(${jq(r.id)})`)}<button class="small" onclick="ui.rv.why=null;renderReviewAgain()">Cancel</button></div></div>` : '';

  } else {
    actions = `<div class="rv-actions"><button type="button" class="lnk" onclick="go('agents')">Back to Agents</button><span class="grow"></span><button type="button" class="lnk" onclick="ui.rv.files=!ui.rv.files;renderReviewAgain()">${ui.rv.files ? 'Hide' : 'Show'} the files</button>${r.map ? `<button type="button" class="lnk" onclick="go('review',${jq(r.id + '/map')})">Show on the map</button>` : ''}</div>`;
  }
  const files = ui.rv.files ? (r.files || []).map(f => `<div class="small mt-1"><b class="mono">${esc(f.file)}</b> <span class="hint">${esc((f.summaries || []).join('; '))}${f.comments_lost ? ` · loses ${plural(f.comments_lost, 'comment')}` : ''}</span></div><div class="diff">${diffHtml(f.before, f.after)}</div>`).join('') : '';

function copyText(t){ try { navigator.clipboard.writeText(t); note('Copied'); } catch (e) { note('Copy did not work here; select the text instead', true); } }
async function acceptP(id){
  const r = RV; if (!r || r.id !== id) return;
  const removes = (r.changes || []).filter(x => x.op === 'remove');
  if (removes.length && !ui.rv.confirmRemove) { ui.rv.confirmRemove = true; renderReviewAgain(); return; }
  if (!decideName()) return;
  const fixes = [];
  (r.questions || []).forEach((q, i) => {
    const v = ui.rv.fixes[i]; if (!q.ask || !v) return; const f = q.fix || {};
    if (f.op === 'add_metric') { if (!v.pick) return; const [how, column] = v.pick.split(':'); fixes.push({ op: 'add_metric', entity: f.entity, how, column, leave_out: v.leave_out || '' }); return; }
    if (f.op === 'distinct') { if (v.on) fixes.push({ op: 'distinct', a: f.a, b: f.b, why: (v.why || '').trim() }); return; }
    const t = (v.text || '').trim(); if (!t) return;
    if (f.op === 'set_metric') fixes.push({ op: 'set_metric', metric: f.metric, [f.field]: t });
    else if (f.op === 'set_type_description') fixes.push({ op: 'set_type_description', type: f.type, description: t });
  });
  const res = await post(B + '/api/proposals/accept', { id, seen: r.fingerprint || '', fixes });
  if (res.written) { toast(res); ui.rv = null; await loadSummary(); renderReview($('view')); return; }
  toast(res.error ? res : { ...res, error: res.error || 'Not accepted' });
  renderReview($('view'));
}
async function signP(id){

}
async function dismissP(id){

// an agent reporting a check: a person promotes it, or not
function checkCard(p){
  const c = p.check || {};
  const what = c.kind === 'binding' ? `the data binding of ${c.name}` : `${c.kind} ${c.name}`;
  return `<div class="card ${p.status==='pending'?'need':''}"><div class="row"><b>An agent reports a check: ${esc(what)} against ${esc(c.against)}</b><span class="chip">check</span><span class="push hint">${esc(agentOf(p.via))} · ${esc(localWhen(p.created_at))}</span></div><div>“${esc(c.note)}”</div>${p.reason ? `<div class="hint">${esc(p.reason)}</div>` : ''}<div class="row">${p.status==='pending' ? `<span>Did you see this match yourself?</span><span class="push"></span>${ro() ? '' : nameBtn('Yes, mark as checked', 'Type your name to mark it', `decide(${jq(p.id)},'accept')`, 'primary small') + nameBtn('Not now', 'Type your name first', `decide(${jq(p.id)},'dismiss')`)}` : `<span class="push hint">${esc(decidedWords(p))} · ${esc(localWhen(p.resolved_at))}</span>`}</div></div>`;
}
function diffHtml(before, after){
  const a = (before||'').split('\n'), b = (after||'').split('\n'); const sa = new Set(a), sb = new Set(b);
  const out = []; let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (i < a.length && j < b.length && a[i] === b[j]) { out.push(['=', a[i]]); i++; j++; }
    else if (j < b.length && !sa.has(b[j])) { out.push(['+', b[j]]); j++; }
    else if (i < a.length && !sb.has(a[i])) { out.push(['-', a[i]]); i++; }
    else if (j < b.length) { out.push(['+', b[j]]); j++; } else { out.push(['-', a[i]]); i++; }
  }
  const changed = out.filter(x => x[0] !== '=').length;
  const keep = []; out.forEach((x, k) => { if (x[0] !== '=' || out.slice(Math.max(0,k-2), k+3).some(y => y[0] !== '=')) keep.push(x); });
  if (!changed) return '(identical to the current file)';
  return keep.map(([m, l]) => `<div class="${m==='+'?'add':(m==='-'?'del':'')}">${m==='='?' ':m} ${esc(l)}</div>`).join('');
}
async function decide(id, what){ if (!decideName()) return; const p = (PR.proposals || []).find(x => x.id === id) || {}; const r = await post(B + '/api/proposals/' + what, { id }); if (what === 'accept') await afterWrite({ ...r, summary: r.written ? (p.check ? `Marked ${p.check.kind} ${p.check.name} as checked` : 'Accepted') : undefined }); else if (r.error) { toast(r); } else { toast({ written: true, summary: 'Set aside' }); } render(); }
const toolExamples = { search: {query: 'lead time'}, describe: {name: ''}, neighbors: {name: '', depth: 1}, path: {from: '', to: ''}, constraints_for: {name: ''}, validate: {action: '', inputs: {}}, where_is: {type: ''}, instances: {type: '', limit: 3}, summary: {}, query: {sql: 'select name from nodes limit 5'}, tables: {}, propose_change: {file: 'glossary.yaml', content: '', reason: ''}, match_file: {file_name: 'promo_sales.csv', columns: [{name: 'line_id', examples: ['L-1', 'L-2']}, {name: 'revenue', examples: ['43.20', '19.80']}]} };
function toolTemplate(){ const n = $('tool-name'); if (!n) return; const ex = JSON.parse(JSON.stringify(toolExamples[n.value] || {})); const t0 = (O.types[0]||{}).name || ''; for (const k of ['name','type','from']) if (k in ex && !ex[k]) ex[k] = t0; if ('to' in ex && !ex.to) ex.to = (O.types[1]||O.types[0]||{}).name || ''; if ('action' in ex) ex.action = (O.actions[0]||{}).action || ''; $('tool-args').value = JSON.stringify(ex, null, 2); }
async function runTool(){ let args = {}; try { args = JSON.parse($('tool-args').value || '{}'); } catch (e) { $('tool-out').style.display = 'block'; $('tool-out').textContent = 'arguments are not valid JSON: ' + e.message; return; } const r = await post(B + '/api/tool', { name: $('tool-name').value, arguments: args }); $('tool-out').style.display = 'block'; $('tool-out').textContent = (r.isError ? '[error] ' : '') + (r.content && r.content[0] ? r.content[0].text : JSON.stringify(r, null, 2)); if ($('tool-name').value === 'propose_change') { PR = await api(B + '/api/proposals'); await loadSummary(); } }

// --- YAML editor (whole file) and template-based creation ---
async function openEditor(file, name, kind){

const kindFolder = { type: 'types', action: 'actions', relationship: 'relationships', source: 'sources', constraint: 'constraints', metric: 'logic', function: 'logic' };

}
// read-only: the same file, readonly, with no Save or Delete; Copy YAML, Open in Files and (for a shipped space) copy it into a space of your own
