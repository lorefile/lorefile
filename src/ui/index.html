<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Lorefile</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1a1a1f;--muted:#6e6e78;--faint:#8e8e96;--line:#e6e6e2;--line2:#d9d9d4;--accent:#2b5cff;--accent-soft:#eef2ff;--block:#b91c1c;--block-bg:#fde8e8;--warn:#b45309;--warn-bg:#fef3e2;--info:#2b5cff;--info-bg:#e7eeff;--ok:#15803d;--ok-bg:#e8f5ec;--chip:#f0f0ed;--need:#fffbf3;--need-line:#f5d9a8;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--accent);text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;cursor:pointer;min-height:36px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.small{padding:5px 10px;min-height:30px;font-size:12.5px}button.danger{color:var(--block)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel)}
input.need,textarea.need{background:var(--need);border-color:var(--need-line)}
input:disabled,textarea:disabled,select:disabled{opacity:.55;background:var(--chip);cursor:default}
textarea{resize:vertical}
#app{display:grid;grid-template-rows:52px 1fr 34px;grid-template-columns:240px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
header .name{font-weight:700;font-size:15px}header select{max-width:260px;padding:5px 8px;min-height:32px;font-weight:600;font-size:13px}header .counts{color:var(--muted);font-size:13px}
.meter{width:120px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}.meter div{height:6px;background:var(--accent);border-radius:999px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.plain{background:var(--chip);color:var(--muted)}
nav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
nav input{width:100%;margin-bottom:8px;background:var(--bg)}
nav h4,.aside h4,.main h4{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
nav .step{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:none;border-radius:9px;padding:8px 10px;min-height:42px;width:100%}
nav .step:hover{background:var(--chip)}nav .step.active{background:var(--accent-soft)}
nav .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--line);color:var(--muted)}
nav .dot.ok{background:var(--ok);color:#fff}nav .dot.warn{background:var(--warn-bg);color:var(--warn)}nav .step.active .dot{background:var(--accent);color:#fff}
nav .t{font-weight:600;font-size:13.5px}nav .s{font-size:12px;color:var(--muted)}nav .s.warn{color:var(--warn)}
nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
nav .result{display:flex;gap:8px;align-items:center;text-align:left;background:transparent;border:none;border-radius:8px;padding:6px 8px;min-height:34px;width:100%;font-size:13px}nav .result:hover{background:var(--chip)}
nav .result small{width:52px;flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#view{display:flex;min-height:0;min-width:0}
.main{flex:1 1 auto;min-width:0;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.list{flex:0 0 240px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.list .item{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:none;border-radius:8px;padding:7px 8px;min-height:34px;width:100%;font-size:13.5px}
.list .item:hover{background:var(--chip)}.list .item.active{background:var(--accent);color:#fff}.list .item .gap{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.aside{flex:0 0 360px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.step-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:24px;font-weight:700}h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}h2{margin:0;font-size:18px}
.desc{color:var(--muted);max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.need{border-color:var(--need-line);background:var(--need)}.card.sel{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sev{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.sev.block{background:var(--block-bg);color:var(--block)}.sev.warn{background:var(--warn-bg);color:var(--warn)}.sev.info{background:var(--info-bg);color:var(--info)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0}
.chip.pick{cursor:pointer;border:1px solid var(--line2);background:var(--panel)}.chip.pick.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 12px}.tabs button.on{color:var(--ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:11.5px}
.mono{font-family:var(--mono);font-size:12.5px}code,pre{font-family:var(--mono);font-size:12px}
pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word}
code.block{display:block;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.cmd{display:flex;gap:8px;align-items:flex-start}.cmd code.block{flex:1 1 auto;min-width:0}.cmd button{flex:0 0 auto}
.col{display:flex;flex-direction:column;gap:6px}.hint{font-size:12.5px;color:var(--muted)}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center;max-width:720px}
.form label{font-size:12.5px;color:var(--muted)}
.verdict{padding:10px 12px;border-radius:10px;font-weight:600}.verdict.pass{background:var(--ok-bg);color:var(--ok)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}.verdict.fail{background:var(--block-bg);color:var(--block)}.verdict.unknown{background:var(--chip);color:var(--muted)}
.res{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.map{position:relative;overflow:auto;flex:1 1 auto;min-width:0;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:22px 22px}
.node{position:absolute;width:220px;height:70px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:4px;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05);z-index:1;min-height:0}
.node.sel{box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(0,0,0,.1)}.node b{font-size:14.5px}.node .tags{display:flex;gap:5px;flex-wrap:wrap}.node .tags span{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.edge{position:absolute;height:2px;background:var(--line2);transform-origin:0 50%;z-index:0}.edge.on{background:var(--ink)}
.elabel{position:absolute;width:88px;text-align:center;font-size:10.5px;color:var(--faint);background:var(--bg);border-radius:999px;padding:1px 0;z-index:0}.elabel.on{color:var(--ink)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
footer{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.toast{position:fixed;right:18px;bottom:48px;max-width:460px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13px;z-index:50}.toast.bad{border-left-color:var(--block)}
.d{font-family:var(--mono);font-size:12px;padding:3px 0}.d.error{color:var(--block)}.d.warning{color:var(--warn)}
.empty{color:var(--muted);padding:40px;text-align:center}
textarea.yaml{width:100%;min-height:420px;font-family:var(--mono);font-size:12.5px;line-height:1.5;tab-size:2}textarea.yaml[readonly]{background:var(--bg)}
.diff{font-family:var(--mono);font-size:12px;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}.diff .add{color:var(--ok)}.diff .del{color:var(--block)}.diff .file{font-weight:700;color:var(--ink);margin-top:8px}.diff .file:first-child{margin-top:0}.diff .hunk{color:var(--faint)}
.chip.agent{background:var(--warn-bg);color:var(--warn);font-weight:600}.chip.person{background:var(--ok-bg);color:var(--ok);font-weight:600}
.hist .when{font-size:12.5px;color:var(--muted);width:112px;flex:0 0 auto}.hist .chip{margin:0}.hist b{font-size:13.5px}
.grade{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.grade.proposed,.grade.changed{background:var(--warn-bg);color:var(--warn)}.grade.accepted{background:var(--info-bg);color:var(--info)}.grade.checked{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--block-bg);color:var(--block)}
.gline{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5}.gline>span:last-child{min-width:0}.gline button{margin-left:4px}.gl-i{flex:0 0 auto;width:16px;text-align:center;color:var(--muted);font-weight:700}.gl-i.ok{color:var(--ok)}.gl-i.warn{color:var(--warn)}
button.lnk.quiet{color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;margin-left:6px}
.meaning{font-size:12.5px;color:var(--muted)}.meaning summary{cursor:pointer;width:max-content}.meaning div{margin-top:3px}
.kinds-hint{font-size:12px;margin-top:2px}
.card details>summary{cursor:pointer;font-size:12.5px;color:var(--muted);width:max-content}.details{display:flex;flex-direction:column;gap:5px;margin-top:6px;font-size:13px}.drow{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:baseline}.drow pre{margin:0}
.namebox .row{align-items:center}
button.lnk{background:none;border:none;color:var(--accent);padding:0;min-height:0;cursor:pointer;font:inherit;text-align:left}button.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.rv{display:flex;flex-direction:column;gap:12px;max-width:880px;min-width:0}
.rv-title{font-size:22px;line-height:1.3}
.rv-says{background:var(--bg);border-left:3px solid var(--line2);padding:8px 12px;border-radius:6px;font-size:13.5px;overflow-wrap:anywhere}
.rv-state{font-weight:600;padding:8px 12px;border-radius:10px;background:var(--chip)}.rv-state.ok{background:var(--ok-bg);color:var(--ok)}
.rv-note{display:flex;gap:8px;align-items:flex-start;background:var(--info-bg);border-radius:10px;padding:8px 12px;font-size:13px}.rv-note.bad{background:var(--block-bg);color:var(--block)}
.rv-counts{display:flex;flex-direction:column;gap:4px}
.rv-count{display:flex;gap:10px;font-size:13.5px}.rv-count-l{flex:0 0 72px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.rv-changes{display:flex;flex-direction:column;gap:8px}

.rv-inherited{color:var(--faint);margin-top:2px}
.rv-change{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.rv-op-add{border-left-color:var(--ok)}.rv-op-change{border-left-color:var(--warn)}.rv-op-remove{border-left-color:var(--block);background:#fff8f8}
.rv-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rv-sym{font-family:var(--mono);font-weight:700;width:14px;flex:none;text-align:center}
.rv-op-add .rv-head .rv-sym{color:var(--ok)}.rv-op-change .rv-head .rv-sym{color:var(--warn)}.rv-op-remove .rv-head .rv-sym{color:var(--block)}
.rv-fields{font-size:13px}.rv-fields td{padding:4px 6px}
.rv-field{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font-size:13px}.rv-field.rv-add .rv-sym{color:var(--ok)}.rv-field.rv-remove{color:var(--block)}.rv-field.rv-remove .mono{text-decoration:line-through}
.rv-diff{font-size:13px}.rv-before{text-decoration:line-through;color:var(--muted)}
.rv-uses{font-size:12.5px;color:var(--block);flex-basis:100%}
.rv-qs{display:flex;flex-direction:column;gap:10px}.rv-q{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.rv-actions{position:sticky;bottom:-22px;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.rv-bar{position:sticky;top:0;left:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;font-size:13px}
.node.st-new{border:2px solid var(--ok)}.node.st-changed{border:2px dashed var(--warn)}.node.st-removed{border:2px solid var(--block);opacity:.8}.node.st-removed b{text-decoration:line-through}
.edge.st-new{background:var(--ok)}.edge.st-changed{background:var(--warn)}.edge.st-removed{background:var(--block);opacity:.5}
.st-tag.st-new{background:var(--ok-bg);color:var(--ok)}.st-tag.st-changed{background:var(--warn-bg);color:var(--warn)}.st-tag.st-removed{background:var(--block-bg);color:var(--block)}
.legend i.st-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;background:var(--panel)}.st-dot.st-new{border:2px solid var(--ok)}.st-dot.st-changed{border:2px dashed var(--warn)}.st-dot.st-removed{border:2px solid var(--block)}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;height:auto;min-height:100vh}
  header{grid-column:1;padding:8px 12px}header .counts,header .meter,#h-ready{display:none}header select{max-width:100%}
  nav{grid-column:1;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:6px 8px;gap:4px}
  nav input,nav h4,nav .s,nav .result,nav > div{display:none}
  nav .step{width:auto;flex:0 0 auto;min-height:36px;padding:6px 8px}
  #view{grid-column:1;flex-direction:column;min-width:0}.main{padding:14px 16px;overflow:visible}.aside,.list{flex:0 0 auto;border:none}
  footer{grid-column:1;flex-wrap:wrap;padding:6px 12px}
  .rv-count{flex-direction:column;gap:2px}.rv-count-l{flex:none}
  .rv-fields tr{display:flex;flex-wrap:wrap;gap:2px 8px;border-bottom:1px solid var(--line);padding:4px 0}.rv-fields td{border:none;padding:0}
  .rv-actions{bottom:0}
}
/* ---------- plane: Home and Map ---------- */
.pl-wrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;padding:12px 16px;overflow:auto;position:relative}
.pl-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}.pl-tools:empty{display:none}
.chk{display:inline-flex;gap:4px;align-items:center;font-size:12.5px}
.pl-views{display:flex;gap:2px;border-bottom:1px solid var(--line)}.pl-views button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:600;padding:6px 12px;min-height:34px}.pl-views button.on{color:var(--ink);border-color:var(--accent)}
.pl-stage{flex:1 1 auto;min-height:440px;border:1px solid var(--line);border-radius:12px;background:#fbfbf9;overflow:hidden;position:relative}
.pl-svg{width:100%;height:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}.pl-svg:focus{outline:none}
.pl-plane{fill:#f3f3f0;stroke:#e3e3dd}
.pl-area{font-size:13px;font-weight:700;letter-spacing:.04em}
.pl-item{cursor:pointer;outline:none}
.pl-item .top{fill:#fff;stroke:#d6d6d0;stroke-width:1}
.pl-item .side-l{fill:#ececE8}.pl-item .side-r{fill:#e0e0db}
.pl-item .lift{transition:transform .15s ease,filter .15s ease}
.pl-item.tile:hover .lift,.pl-item.tile:focus-visible .lift{transform:translateY(-3px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.pl-item.sel .top,.pl-item:focus-visible .top{stroke:var(--accent);stroke-width:2.5}
.pl-item:focus-visible .mn{outline:2px solid var(--accent);outline-offset:2px}
.pl-item.chip:focus-visible circle,.pl-item.chip.sel circle{stroke:var(--accent);stroke-width:2.5}
.pl-item.dim,.pl-link.dim{opacity:.35}
.pl-svg text{font-family:var(--sans)}
.pl-item text.lbl,.pl-svg text.lbl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.pl-svg .sub{font-size:11px;fill:var(--muted)}.pl-svg .sub.mono{font-family:var(--mono)}
.pl-svg .tok{font-size:11px;fill:#55555e;font-weight:600;letter-spacing:.02em}
.chipbg{fill:var(--chip)}
.pl-badge circle{stroke:#fff;stroke-width:1.5}.pl-badge text{font-size:11px;font-weight:800;fill:#fff}
.pl-badge.red circle{fill:var(--block)}.pl-badge.amber circle,.pl-badge.mono circle{fill:var(--warn)}.pl-badge.green circle{fill:var(--ok)}
.pl-ring{fill:none;stroke-width:2;stroke-dasharray:6 4}.pl-ring.amber{stroke:var(--warn)}.pl-ring.red{stroke:var(--block)}
.struck text.lbl{text-decoration:line-through}
.ghost .top{fill:rgba(255,255,255,.4);stroke:#8e8e96;stroke-dasharray:6 4;stroke-width:1.5}
.pl-next line,.pl-next polygon{fill:none;stroke:#c4c4bd;stroke-dasharray:5 5;stroke-width:1.5}
.pl-link line,.pl-link path{stroke:#b4b4ad;stroke-width:1.6}.pl-link.on line,.pl-link.on path{stroke:var(--accent);stroke-width:2.2}
.pl-link.missing line,.pl-link.missing path{stroke:var(--block);stroke-dasharray:4 3}
.pl-kindline line,.pl-kindline path{stroke:#6e6e78;stroke-width:1.6;stroke-dasharray:2 3;fill:none}.pl-kindline.on line,.pl-kindline.on path{stroke:var(--accent)}
.ghostlink line{stroke-dasharray:6 4;stroke-width:2}.ghostlink.new line{stroke:var(--ok)}.ghostlink.removed line{stroke:var(--block)}
.pl-svg .warnc,.warnc{fill:var(--warn);color:var(--warn)}
.pl-between line{stroke:#bcbcb5;stroke-width:1.2;stroke-dasharray:3 4}.pl-between.on line{stroke:var(--accent);stroke-width:1.8}
.pl-tier rect{fill:#fafaf8;stroke:#e3e3dd}
.pl-svg .pl-tierlbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;fill:var(--muted)}
.chip circle.mono{fill:var(--accent)}.pl-svg .monot{fill:#fff;font-weight:700;font-size:13px}
.chip circle.srcc{fill:#fff;stroke:#d6d6d0}
.pl-open rect{fill:var(--accent)}.pl-open text{fill:#fff;font-size:11.5px;font-weight:600}
.fold .top{fill:#f1f1ee;stroke:#bdbdb6;stroke-dasharray:4 3}
.pl-areatile .top{fill:#fff;stroke:#d6d6d0}.pl-svg .lbl.big{font-size:15px}

<body>
<div id="app">
  <header>
    <div class="logo" role="link" tabindex="0" title="Home" aria-label="Home" onclick="go('home')" onkeydown="if(event.key==='Enter')go('home')" style="cursor:pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="20" r="2"/><path d="M7 7l3 3M17 7l-3 3M12 15v3"/></svg></div>
    <select id="h-space" title="Which space (ontology) to show" onchange="switchSpace(this.value)"></select>
    <span class="name" id="h-name">…</span><span class="counts" id="h-counts"></span>
    <div class="row" style="gap:8px"><div class="meter"><div id="h-meter" style="width:0"></div></div><span style="font-size:12.5px;color:var(--muted)" id="h-ready"></span></div>
    <span style="flex:1"></span>
    <span id="h-mode" class="pill plain"></span>
    <button class="small" onclick="reload()">Reload</button>
    <a id="h-md" href="#" target="_blank"><button class="small">Summary.md</button></a>
  </header>
  <nav id="nav"></nav>
  <div id="view"></div>
  <footer id="footer"></footer>
</div>
<script>
// ---------- state ----------
let O = null, PR = { proposals: [], activity: [] }, DC = {}, TOOLS = null, TEMPLATES = null, TABLES = null, SPACES = null, AUTH = null;
// which space this page shows: /s/<id>/… ; B prefixes every API call so each space has its own URLs
const SP = (location.pathname.match(/^\/s\/([^/]+)/) || [])[1] || null;
const SPACE = SP ? decodeURIComponent(SP) : null;
const B = SP ? '/s/' + SP : '';
const spaceUrl = (id, hash) => '/s/' + encodeURIComponent(id) + '/' + (hash || '#home');
let route = { screen: 'home', arg: '' };
const ui = { mapSel: null, typeTab: 'fields', ruleFilter: 'all', ruleQuery: '', search: '', lf: { from: '', name: '', to: '', card: 'many-to-one', desc: '' }, rf: { name: '', applies: '', field: '', op: '==', value: '', rule: '', sev: 'block', why: '', who: '' }, tryInputs: {}, tryResult: null, sql: "select n.name, n.source_kind, count(c.id) as rules\nfrom nodes n left join constraints c on c.applies_to = n.name\ngroup by all order by rules desc", sqlOut: null, editor: null, newType: null, showProposal: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// a value written into a click handler is a JS string inside an HTML attribute, and the browser undoes the HTML
// escaping before it runs the script: so it is written as a JSON string first, then escaped. Never '${esc(x)}' there.
const jq = (s) => esc(JSON.stringify(String(s ?? '')));
// the same rule the server applies to a name (trust::by_words): a short plain name that never reads as an agent
const nameOk = (n) => n.length <= 60 && /^[\p{L}\p{N} .'_-]+$/u.test(n) && !/agent/i.test(n) && !n.toLowerCase().split(/\s+/).includes('via');
const NAME_RULE = 'Use up to 60 letters, digits, spaces and . - \' _ (no "agent" or "via"): the name is what history and trust.yaml will say.';
// a 401 means the sign-in went away (a new token, or signed out elsewhere): load again and the server shows its login screen
const api = async (p, opt) => { const r = await fetch(p, opt); if (r.status === 401) { location.reload(); return new Promise(() => {}); } return r.json(); };
// the name, kept in this browser (Settings › Your name, the sign-in page, or the first decision), rides along with every
// write: "Priya via page" in history and trust.yaml. Where the browser keeps nothing, it lives in memory for the tab.
let MEM_NAME = '';
const ME = () => { try { return localStorage.getItem('lorefile-name') || MEM_NAME; } catch (e) { return MEM_NAME; } };
function setMe(v){ MEM_NAME = v || ''; try { if (v) localStorage.setItem('lorefile-name', v); else localStorage.removeItem('lorefile-name'); } catch (e) {} }
// every decision from the page waits for a name (the server still takes none, from scripts and older pages)
const nameReady = () => { const n = ME(); return !!n && nameOk(n); };
// a button that needs a name: disabled, with the reason as its label, until there is one ({n} is the name)
const nameBtn = (label, wait, js, cls, off) => { const ok = nameReady(); return `<button class="${cls || 'small'}" data-needs-name data-label="${esc(label)}" data-wait="${esc(wait)}" ${off ? 'data-off' : ''} ${!ok || off ? 'disabled' : ''} onclick="${js}">${esc(ok ? label.replace('{n}', ME()) : wait)}</button>`; };
function syncNameButtons(){ const ok = nameReady(), n = ME(); document.querySelectorAll('[data-needs-name]').forEach(b => { b.disabled = !ok || b.hasAttribute('data-off'); b.textContent = ok ? b.dataset.label.replace('{n}', n) : b.dataset.wait; }); }
function nameBoxHtml(id){
  const me = ME();
  return `<div class="rv-q namebox"><label for="${id}"><b>Your name</b> <span class="hint">kept in this browser, recorded with every decision</span></label><div class="row"><input id="${id}" value="${esc(me)}" placeholder="e.g. Vinay" style="max-width:260px" autocomplete="name" oninput="nameTyped(this)">${me ? `<button type="button" class="lnk" onclick="notMe(${jq(id)})">not you?</button>` : ''}</div><div class="name-err"></div>${AUTH && !AUTH.required ? '<div class="hint">This server runs with --no-auth: anyone who can reach it can type any name.</div>' : ''}</div>`;
}
function nameTyped(el){
  const v = el.value.trim(), err = el.closest('.namebox').querySelector('.name-err');
  if (v && !nameOk(v)) { err.innerHTML = `<div class="d error">✗ That name cannot be used. ${esc(NAME_RULE)}</div>`; setMe(''); }
  else { err.innerHTML = ''; setMe(v); }
  syncNameButtons();
}
function notMe(id){ setMe(''); const b = $(id); if (b) { b.value = ''; nameTyped(b); b.focus(); } }
// a name box for screens whose decisions sit on cards, shown only while no name is known
const nameBar = () => !ro() && !shipped() && !nameReady() ? `<div class="card">${nameBoxHtml('nb-name')}</div>` : '';
function decideName(){
  if (nameReady()) return ME();
  const b = document.querySelector('.namebox input');
  if (b) { note('Type your name first: it is recorded with every decision.', true); b.focus(); return null; }
  // no box on this screen (Vouch for all under What to do next): ask once
  const v = (prompt('Your name, recorded with this decision (kept in this browser)') || '').trim();
  if (!v) return null;
  if (!nameOk(v)) { note('That name cannot be used. ' + NAME_RULE, true); return null; }
  setMe(v); return v;
}
const post = (p, body) => api(p, { method:'POST', headers:{'Content-Type':'application/json', 'X-Lorefile':'write'}, body: JSON.stringify(ME() && body && typeof body === 'object' && !Array.isArray(body) ? Object.assign({ by: ME() }, body) : body) });
// --- grades: who stands behind each definition (trust.yaml) ---
const TR = (kind, name) => ((O.trust && O.trust.items) || []).find(x => x.kind === kind && x.name === name) || { grade: 'ungraded' };
const shortDate = (at) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(at || ''); return m ? `${Number(m[3])} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2]) - 1]}` : (at || ''); };
const whoSaid = (by) => { const n = String(by || '').split(' via ')[0].trim(); return !n || n === 'person' ? 'a person' : (n === 'agent' ? 'an agent' : n); };
function gradeChip(kind, name){
  const t = TR(kind, name); const say = esc(t.say || 'Nobody has said yet who stands behind this.');
  if (t.changed_since) return `<span class="grade changed" title="${say}">✎ changed since ${esc(t.changed_since.split(' ')[0])}</span>`;
  if (t.grade === 'checked') return `<span class="grade checked" title="${say}">● checked</span>`;
  if (t.grade === 'accepted') return `<span class="grade accepted" title="${say}">✓ accepted</span>`;
  if (t.grade === 'proposed') return `<span class="grade proposed" title="${say}">▲ unverified</span>`;
  return `<span class="grade" title="${say}">ungraded</span>`;
}
// "Vinay" from "Vinay via page"; a decision made with no name says so
const anonBy = (by) => whoSaid(by) === 'a person';
const whoWords = (by) => anonBy(by) ? 'a person (no name was given)' : whoSaid(by);
const agentWho = (by) => { const a = agentOf(by); return a === 'An agent' ? 'an agent' : a; };
const labelOf = (n) => /[a-z]/.test(String(n || '')) ? human(snake(n)) : String(n || '');
const kindName = (k, n) => k === 'binding' ? `the source of ${n}` : k === 'term' ? `the also-called word “${n}”` : `${k} ${n}`;
// the line in words under a definition: who stands behind it, and what that means for agents
function gradeLine(kind, name, opts){
  const t = TR(kind, name), k = jq(kind), n = jq(name), can = !ro(), o = opts || {};
  const sign = can && anonBy(t.by) && (t.grade === 'accepted' || t.grade === 'checked') && !t.changed_since ? ' ' + nameBtn('Put your name on it', 'Type your name to sign it', `signGrade(${k},${n})`) : '';
  const looks = can ? ' ' + nameBtn('Looks right', 'Type your name first', `looksRight(${k},${n})`) : '';
  const again = can && kind !== 'term' && !o.noCheckAgain ? ` <button type="button" class="lnk quiet" onclick="openCheck(${k},${n})">Check again…</button>` : '';
  let h;
  if (t.changed_since) { const [g, at] = t.changed_since.split(' '); h = `<span class="gl-i warn" aria-hidden="true">✎</span><span><b>Changed since ${esc(whoWords(t.was_by))} ${esc(g)} it on ${esc(shortDate(at))}.</b> Look again.${looks}</span>`; }
  else if (t.grade === 'checked') h = `<span class="gl-i ok" aria-hidden="true">●</span><span><b>Checked against ${esc(t.against || 'a source')} by ${esc(whoWords(t.by))}, ${esc(shortDate(t.at))}</b>${t.note ? `: “${esc(t.note)}”` : ''}. Agents use it.${sign}${again}</span>`;
  else if (t.grade === 'accepted') h = `<span class="gl-i ok" aria-hidden="true">✓</span><span><b>Accepted by ${esc(whoWords(t.by))}, ${esc(shortDate(t.at))}: agents use it.</b>${sign}${can && kind !== 'term' ? ` <button type="button" class="lnk quiet" onclick="openCheck(${k},${n})">I compared it with real numbers… (optional)</button>` : ''}</span>`;
  else if (t.grade === 'proposed') h = `<span class="gl-i warn" aria-hidden="true">▲</span><span><b>Unverified</b>: proposed by ${esc(agentWho(t.by))} on ${esc(shortDate(t.at))}; no person has looked.${looks}</span>`;
  else h = `<span class="gl-i" aria-hidden="true">·</span><span>Nobody has graded this yet.${looks}</span>`;
  return `<div class="gline">${h}</div>`;
}
const gradeMeaning = () => `<details class="meaning"><summary>What do these mean?</summary><div>✓ <b>Accepted</b>: a person stands behind it, and agents use it as settled.</div><div>● <b>Checked</b> (optional): someone ran it against real rows and the result was right.</div><div>▲ <b>Unverified</b>: an agent wrote it and no person has looked; agents say so.</div></details>`;
// the small buttons beside a chip where there is no room for a line (an also-called word on an entity)
function gradeButtons(kind, name){
  if (ro()) return '';
  const t = TR(kind, name), k = jq(kind), n = jq(name);
  if (t.changed_since || (t.grade !== 'accepted' && t.grade !== 'checked')) return nameBtn('Looks right', 'Type your name first', `looksRight(${k},${n})`);
  return anonBy(t.by) ? nameBtn('Put your name on it', 'Type your name to sign it', `signGrade(${k},${n})`) : '';
}
async function looksRight(kind, name){ if (!decideName()) return; const r = await post(B + '/api/trust', { op: 'accept', kind, name }); await afterWrite({ ...r, summary: r.written ? `Accepted ${kindName(kind, name)}` : undefined }); }
async function signGrade(kind, name){ if (!decideName()) return; const r = await post(B + '/api/trust', { op: 'sign', kind, name }); await afterWrite(r); }
function openCheck(kind, name){ const sources = (O.sources || []).map(s => s.connection); ui.check = { kind, name, against: (ui.check && ui.check.against) || sources[0] || '', note: '' }; renderSheet(); }
function renderSheet(){
  let el = $('sheet'); if (!ui.check) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheet'; document.body.appendChild(el); }
  const c = ui.check; const what = c.kind === 'binding' ? `${labelOf(c.name)}’s source` : c.kind === 'metric' ? labelOf(c.name) : `${c.kind} ${c.name}`;
  el.innerHTML = `<div class="card"><b style="font-size:15px">You compared ${esc(what)} with real numbers</b><div style="font-size:13px">Optional: accepted is all agents need. This records that you ran it against real rows and the result was right. Lorefile records your word; it does not run anything.</div><div class="form"><label>Against which source</label><select id="ck-against">${(O.sources || []).map(s => `<option ${s.connection===c.against?'selected':''}>${esc(s.connection)}</option>`).join('')}</select><label>What did you compare</label><textarea id="ck-note" rows="2" placeholder="e.g. 412 paid orders for 16–22 Nov, the same as Shopify's own report">${esc(c.note)}</textarea></div>${nameBoxHtml('ck-name')}<div id="ck-err"></div><div class="row" style="justify-content:flex-end"><button onclick="ui.check=null;renderSheet()">Cancel</button>${nameBtn('Mark as checked', 'Type your name to mark it', 'saveCheck()', 'primary')}</div></div>`;
}
async function saveCheck(){
  const c = ui.check; const name = decideName(); if (!name) return;
  const r = await post(B + '/api/trust', { op: 'check', kind: c.kind, name: c.name, against: $('ck-against').value, note: $('ck-note').value, by: name });
  if (!r.written) { const why = r.error || r.refused || (r.diagnostics || []).filter(d => d.level === 'error').map(d => d.message).join('; ') || 'Not saved'; $('ck-err').innerHTML = `<div class="d error">✗ ${esc(why)}</div>`; return; }
  const against = $('ck-against').value;
  ui.check = null; renderSheet(); await afterWrite({ ...r, summary: `Checked ${kindName(c.kind, c.name)} against ${against}` });
}
async function vouchAll(){
  const tc = (O.trust && O.trust.counts) || {}; const n = (tc.ungraded || 0) - (tc.changed || 0);
  const me = decideName(); if (!me) return;
  if (!confirm(`Vouch for ${n} ungraded definition${n===1?'':'s'}?\n\nEach metric, source choice, also-called word and guardrail nobody has graded yet is saved as accepted by ${me}, in one change. What an agent proposed, and what changed since a person graded it, still need a look each.`)) return;
  const r = await post(B + '/api/trust', { op: 'vouch_all' }); await afterWrite({ ...r, summary: r.written ? `Vouched for ${r.name} definitions` : undefined });
}
const snake = (s) => String(s).replace(/([a-z0-9])([A-Z])/g, '$1_$2').replace(/[-\s]+/g, '_').toLowerCase();
const human = (s) => String(s).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const sevLabel = { block: 'stop', warn: 'warn', info: 'note' };
const sev = (s) => `<span class="sev ${s}">${sevLabel[s] || s}</span>`;
const owner = (o) => o ? human(String(o).split('@')[0]) + (o.includes('@') ? ' team' : '') : 'no one named yet';
const PALETTE = ['#2b5cff', '#0f766e', '#7c3aed', '#db2777', '#b45309', '#0369a1', '#4d7c0f', '#9f1239'];
const domainColor = (d) => { const i = (O.domains || []).findIndex(x => x.name === d); return i >= 0 ? PALETTE[i % PALETTE.length] : '#6e6e78'; };
const describe = async (name) => DC[name] || (DC[name] = await api(B + '/api/describe?name=' + encodeURIComponent(name)));

// ---------- derived facts ----------
function facts(){
  const types = O.types || [], rels = O.relationships || [], rules = O.constraints || [];
  const gapTypes = types.filter(t => t.described < t.fields);
  const unbound = types.filter(t => !t.has_source);
  const relsNoDesc = rels.filter(r => !r.description || !r.description.trim());
  const noOwner = rules.filter(r => !r.owner);
  const metrics = O.metrics || [], metricsNoOwner = metrics.filter(m => !m.owner), fns = O.functions || [];
  const totalFields = types.reduce((n, t) => n + t.fields, 0) || 1;
  const described = types.reduce((n, t) => n + t.described, 0);
  const ready = !types.length ? 0 : Math.round(100 * ((described / totalFields) * 0.5 + (rels.length ? (rels.length - relsNoDesc.length) / rels.length : 1) * 0.3 + (types.length ? (types.length - unbound.length) / types.length : 1) * 0.2));
  return { types, rels, rules, metrics, metricsNoOwner, fns, gapTypes, unbound, relsNoDesc, noOwner, ready, pending: O.proposals_pending || 0 };
}

const HINTS = { entity: ['Entity', 'a kind of thing in your business'], field: ['Field', 'one fact about an entity, like a column'], link: ['Link', 'how two entities connect'], metric: ['Metric', 'a number every agent computes the same way'], function: ['Function', 'an operation an agent can run with its own tools'], guardrail: ['Guardrail', 'a rule an action must not break'], action: ['Action', 'something agents may do'], source: ['Source', 'where an entity’s rows come from'], word: ['Also called', 'another word people use for an entity'], kind: ['A kind of', 'an entity that is a narrower version of another, with all its fields'] };

const sourceWords = (conn) => { const s = (O.sources || []).find(x => x.connection === conn); return s ? (SOURCE_WORDS[s.kind] || s.kind) : 'not under sources/'; };
const BASIS_WORDS = { transactional: 'counted from records, not modelled', attributed: 'credited to channels by an attribution model', modelled: 'estimated by a model', experimental: 'measured by an experiment' };
const formulaOf = (s) => s ? `${s.tool ? 'tool ' + s.tool + (s.params && Object.keys(s.params).length ? ' ' + JSON.stringify(s.params) : '') + ' · ' : ''}${s.measure || 'count(*)'}${s.filter ? ' where ' + s.filter : ''}` : '';
// the owner of a metric, in a line: who decides what it means. Empty: a box to name one (set_metric).

function renderLogic(v){
  const f = facts();

  const mcards = f.metrics.map(m => {
    const sentences = (m.sentences || []).filter(Boolean);

  }).join('');
  const fcards = f.fns.map(fn => {
    const takes = `Takes ${esc(ioText(fn.inputs))}, gives ${esc(ioText(fn.outputs))}`;
    const details = det('f:' + fn.name, drow('In', `<span class="mono">${esc(ioText(fn.inputs))}</span>`) + drow('Out', `<span class="mono">${esc(ioText(fn.outputs))}</span>`) + drow('Runs', esc(runsText(fn.runs))) + ((fn.may_be_called_by||[]).length ? drow('Called by', esc(fn.may_be_called_by.join(', '))) : '') + drow('Name', `<span class="mono">${esc(fn.name)}</span> · <span class="mono hint">${esc(fn.file)}</span> ${yamlBtn(fn.file, fn.name, 'function')}`));

  }).join('');
  const emptyM = f.metrics.length ? '' : `<div class="card need"><b>No metrics yet</b><div style="font-size:13px;color:var(--muted)">Start with <span class="mono">success</span>: the one number this business is run on, and where it comes from. The first time an agent does the reporting it can save this for you with <span class="mono">propose_patch</span>; you accept it under Agents.</div></div>`;
  const emptyF = f.fns.length ? '' : `<div class="card need"><b>No functions yet</b><div style="font-size:13px;color:var(--muted)">A function is a contract plus a pointer: inputs, outputs, and the MCP tool or endpoint that does the work. Forecasting, cancelling an order, moving a budget. Agents read it to know what to call.</div></div>`;
  v.innerHTML = main(roBanner() + stepHead(4, 'Logic', 'The metrics and the functions of this business, written down once so every agent uses the same ones.') + intro + nameBar()

  if (ui.focusOwner) { ui.focusOwner = false; const b = document.querySelector('.owner-box'); if (b) { b.scrollIntoView({ block: 'center' }); b.focus(); } }
}

let USAGE_Q = [];
function renderUsage(v){
  const f = facts(); const T = f.types; const terms = O.glossary || []; const acts = O.actions || []; const rels = f.rels;
  const t0 = T[0] && T[0].name; const bound = T.find(t => t.has_source);
  const q = [];
  if (t0) q.push(['Understand', `What is a ${t0}, and what do we track about it?`, `describe("${t0}")`, { name: 'describe', arguments: { name: t0 } }]);
  if (terms[0]) q.push(['Understand', `What do people mean by "${terms[0].term}"?`, `describe("${terms[0].term}") → it is the entity ${terms[0].means}`, { name: 'describe', arguments: { name: terms[0].term } }]);
  if (rels[0]) q.push(['Understand', `What is connected to ${rels[0].from}, two steps out?`, `neighbors("${rels[0].from}", depth 2)`, { name: 'neighbors', arguments: { name: rels[0].from, depth: 2 } }]);
  if (f.metrics.length) f.metrics.forEach(m => q.push(['Numbers', `What was ${human(m.name).toLowerCase()} yesterday${m.grain ? ', per ' + m.grain : ''}?`, `describe("${m.name}") gives the recipe; the agent fetches the rows from ${srcOf(m)} with its own login and computes it`, { name: 'describe', arguments: { name: m.name } }]));
  else q.push(['Numbers', 'What counts as success here?', 'Nothing saved yet. The first time an agent reports performance it offers to save the definition with propose_patch; after that this question has one answer.', null]);
  if (bound) q.push(['Numbers', `Where does ${bound.name} data live, and can you read it here?`, `where_is("${bound.name}")`, { name: 'where_is', arguments: { type: bound.name } }]);
  acts.slice(0, 3).forEach(a => { const n = a.action || a.name; const ins = Object.keys(a.inputs || {}); q.push(['Act', `Can I ${human(n).toLowerCase()}${ins.length ? ' this ' + ins[0] : ''}?`, `constraints_for("${n}") lists what must hold; validate("${n}", {${ins.join(', ')}}) checks the real rows and answers pass, warn or blocked, with reasons and who must approve`, { name: 'constraints_for', arguments: { name: n } }]); });
  f.fns.forEach(fn => q.push(['Run', `Run ${human(fn.name).toLowerCase()} for ${Object.keys(fn.inputs || {}).join(' and ') || 'me'}.`, `describe("${fn.name}") → the contract; then the agent ${runsText(fn.runs)}`, { name: 'describe', arguments: { name: fn.name } }]));
  q.push(['Teach', `Remember that "${terms[0] ? terms[0].term : 'cart'}" means ${terms[0] ? terms[0].means : (t0 || 'Order')} here.`, 'propose_patch(op: add_term, …) → written, or queued for a person under Agents', null]);
  q.push(['Teach', 'Save that: our success metric is paid orders from the warehouse.', 'propose_patch(op: add_metric, …) → the Logic step gets a metric everyone shares', null]);
  USAGE_Q = q;
  const setup = `<div class="card"><b>Three steps</b><div style="font-size:13px">1. Connect: <code>claude mcp add lorefile -- lorefile mcp --dir ${esc(O.root)}</code>${O.single ? '' : `, then say <code>space: "${esc(O.space.id)}"</code>`}.<br>2. Ask, in Claude, ChatGPT or Cursor. The agent calls <span class="mono">summary</span> once, then the tools shown below.<br>3. Teach. When you settle a definition in the conversation, the agent offers to save it; you accept it under Agents.</div></div>`;
  const story = `<div class="card"><b>The demo, in two days</b><div style="font-size:13px"><b>Monday.</b> "Give me last week's performance." The agent reads <span class="mono">summary</span>, ${f.metrics[0] ? `sees the metric <span class="mono">${esc(f.metrics[0].name)}</span> and where it comes from` : 'finds no metric, works it out from the sources, and offers to save what it settled'}, fetches the rows through the ${bound && bound.source_kind ? esc(bound.source_kind) : 'data'} MCP with your login, and reports.<br><b>Tuesday.</b> A colleague asks the same thing. Same files, same definition, same number.</div></div>`;
  const groups = ['Understand', 'Numbers', 'Act', 'Run', 'Teach'];
  const cards = groups.map(g => { const items = q.map((x, i) => [x, i]).filter(([x]) => x[0] === g); if (!items.length) return ''; return `<h4 style="padding:0">${g}</h4>` + items.map(([x, i]) => `<div class="card"><b>“${esc(x[1])}”</b><div style="font-size:12.5px;color:var(--muted)">What the agent does: ${esc(x[2])}</div>${x[3] ? `<div class="row"><button class="small" onclick="tryQ(${i})">Try it from here</button></div><pre id="q-out-${i}" style="display:none"></pre>` : ''}</div>`).join(''); }).join('');
  v.innerHTML = main(`<h1>How to use it</h1><div class="desc">The chat happens in your AI tool. This page shows what that tool can now answer about ${esc(O.manifest.name)}, and which ontology call answers it. Every “Try it” runs the real tool.</div>` + setup + story + cards);
}

const shq = (s) => /^[\w@%+=:,./-]+$/.test(String(s)) ? String(s) : `'${String(s).replace(/'/g, `'\\''`)}'`;
const MASK = '••••••••';
const loginOn = () => !!(AUTH && AUTH.required);

function cmdRow(text, kind){ return `<div class="cmd"><code class="block">${esc(text)}</code><button class="small" onclick="copyCmd('${kind}')">Copy</button></div>`; }
async function copyCmd(kind){
  const text = kind === 'connector' ? connectorUrl() : kind === 'connector-space' ? connectorUrl(true) : kind === 'claude-oauth' ? `claude mcp add --transport http lorefile ${connectorUrl()}` : kind === 'http' ? httpCmd(AUTH && AUTH.token || '<token>') : (kind === 'claude' ? `claude mcp add lorefile -- ${stdioCmd()}` : stdioCmd());
  const what = kind.startsWith('connector') ? 'the connector URL' : kind === 'http' && loginOn() ? 'the command, with the token' : 'the command';
  try { await navigator.clipboard.writeText(text); note('Copied ' + what); return; } catch (_) {}
  // plain http on another host has no clipboard API: fall back to a hidden selection
  const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
  t.remove();

}

const oauthOn = () => !!(OAUTH && OAUTH.on);
// the connector URL is this page's own address when it was opened over HTTPS (a tunnel or proxy), or the pinned one
const connectorBase = () => (OAUTH && OAUTH.pinned) || (location.protocol === 'https:' ? location.origin : null);
const connectorUrl = (oneSpace) => { const b = connectorBase(); return b ? (oneSpace && O && O.space && !O.single ? `${b}/s/${encodeURIComponent(O.space.id)}/mcp` : `${b}/mcp`) : null; };

const usedWords = (at) => {

async function gitRemote(){

// --- history ---
function when(iso){
  const d = new Date(iso); if (isNaN(d)) return iso || '';
  const now = new Date(), day = (x) => x.toDateString(), hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (day(d) === day(now)) return 'today ' + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (day(d) === day(y)) return 'yesterday ' + hm;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ' ' + hm;
}
// git's unified diff, in the inbox card's colours: a file name, then + and - lines
function gitDiffHtml(text){
  if (!(text || '').trim()) return '(no file in this space changed)';
  const out = [];
  for (const l of text.replace(/\n$/, '').split('\n')) {
    const f = l.match(/^diff --git a\/(.*) b\/(.*)$/);
    if (f) { out.push({ cls: 'file', text: f[2] }); continue; }
    if (/^new file mode/.test(l)) { const last = out[out.length - 1]; if (last && last.cls === 'file') last.text += ' (new)'; continue; }
    if (/^deleted file mode/.test(l)) { const last = out[out.length - 1]; if (last && last.cls === 'file') last.text += ' (removed)'; continue; }
    if (/^(index |--- |\+\+\+ |old mode|new mode|similarity|rename |Binary files)/.test(l)) continue;
    if (l.startsWith('@@')) { out.push({ cls: 'hunk', text: l.replace(/^(@@[^@]*@@).*$/, '$1') }); continue; }
    out.push({ cls: l[0] === '+' ? 'add' : (l[0] === '-' ? 'del' : ''), text: l });
  }
  return out.map(x => `<div class="${x.cls}">${esc(x.text)}</div>`).join('');
}
async function renderHistory(v){
  const L = await api(B + '/api/git/log?limit=100');

  const head = `<h1>History</h1><div class="desc">Every change to this space, newest first: who made it (an agent or a person), when, and what it did. Show lists it line by line; Undo puts those files back as they were before it, checked like any save, as a new change you can undo too.</div>`;
  if (L.builtin) { v.innerHTML = main(head + `<div class="banner">This ${O.space.group === 'pack' ? 'pack' : 'example'} ships with Lorefile and has no history of its own. ${canCopySpace() ? `<a onclick="ui.ns={name:'',from:${jq(O.space.id)}};go('new-space')">Copy it into a space</a> and that space starts one.` : 'Copy it into a space and that space starts one.'}</div>`); return; }
  const h = L.history || '';
  let state = '';
  if (h === 'off (git not found)') state = `<div class="card need"><b>History is off</b><div style="font-size:13px">git was not found on this computer. Install git and restart the server; everything else works without it.</div></div>`;
  else if (h === 'off (no repository yet)') state = `<div class="card need"><b>History is off for this space</b><div style="font-size:13px">Start it and every change from now on is saved here, with who made it and a way back.</div><div class="row"><button class="primary small" ${ro()?'disabled':''} onclick="gitDo('init')">Start history</button></div></div>`;
  else if (h.startsWith('off (inside')) state = `<div class="banner">This space lives inside another git repository, so its history is that repository's: changes made here stay uncommitted until someone commits them (Settings). Below are that repository's commits that touched this space.</div>`;
  else if (L.error) state = `<div class="banner">${esc(L.error)}</div>`;
  const row = (c) => {

    const diff = open ? `<div class="diff">${ui.histDiff[c.hash] === undefined ? '…' : gitDiffHtml(ui.histDiff[c.hash])}</div>` : '';
    const undo = c.first ? '' : `<button class="small" ${ro()?'disabled':''} title="${ro()?'start with --allow-edit':'Put these files back as they were before this change'}" onclick="histUndo(${jq(c.hash)})">Undo</button>`;
    return `<div class="card hist"><div class="row"><span class="when" title="${esc(c.at)}">${esc(when(c.at))}</span><span class="chip ${c.kind === 'agent' ? 'agent' : 'person'}">${c.kind === 'agent' ? 'agent' : 'person'}</span><span style="font-size:12.5px;color:var(--muted)">${esc(c.author)}</span><span style="margin-left:auto"></span><button class="small" onclick="histShow(${jq(c.hash)})">${open ? 'Hide' : 'Show'}</button>${undo}</div><b>${esc(c.message)}</b><div class="mono" style="font-size:11.5px;color:var(--faint)">${esc(c.short)}${files ? ' · ' + esc(files) : ''}</div>${diff}</div>`;
  };
  const list = ui.hist.length ? ui.hist.map(row).join('') + (L.total > ui.hist.length ? `<div style="font-size:12.5px;color:var(--muted)">The newest ${ui.hist.length} of ${L.total} changes. The rest are in git: <code>git -C ${esc(O.dir)} log</code></div>` : '') : (state ? '' : `<div class="card"><b>No changes yet</b><div style="font-size:13px;color:var(--muted)">The first save from this page, or the first thing an agent saves, shows up here.</div></div>`);
  v.innerHTML = main(head + state + list);
}
async function histShow(hash){
  ui.histShow = ui.histShow === hash ? null : hash; render();
  if (ui.histShow && ui.histDiff[hash] === undefined) {
    const r = await api(B + '/api/git/show?hash=' + encodeURIComponent(hash));
    ui.histDiff[hash] = r.error ? '' : r.diff; if (r.error) toast({ error: r.error });
    if (route.screen === 'history') render();
  }
}
async function histUndo(hash){
  const c = (ui.hist || []).find(x => x.hash === hash); if (!c) return;
  const files = c.files || [];
  const what = files.length === 1 ? files[0] + ' back as it was' : (files.length ? files.length + ' files back as they were' : 'things back as they were');
  if (!confirm(`Put ${what} before '${c.message}'?\n\nThe space is compiled with ${files.length === 1 ? 'that file' : 'those files'} put back first, like any save; if that leaves an error, nothing changes. The undo is a new change in History, so it can be undone too.`)) return;
  const r = await post(B + '/api/git/undo', { hash });
  ui.histShow = null;
  await afterWrite(r);
  if (!r.written) render();
}

  const rules = f.rules.filter(c => (ui.ruleFilter === 'all' || c.severity === ui.ruleFilter) && (!q || `${c.id} ${c.name} ${c.applies_to} ${c.rationale||''}`.toLowerCase().includes(q)));
  const count = (s) => f.rules.filter(c => c.severity === s).length;
  const filters = [['all', `All ${f.rules.length}`], ['block', `Stop ${count('block')}`], ['warn', `Warn ${count('warn')}`], ['info', `Note ${count('info')}`]].map(([k, l]) => `<span class="chip pick ${ui.ruleFilter===k?'on':''}" onclick="ui.ruleFilter='${k}';render()">${l}</span>`).join('');

  const time = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(' AM', ' am').replace(' PM', ' pm');

  const diff = Math.round((day(new Date()) - day(t)) / 86400000);
  if (diff === 0) return 'today ' + time;

const toolExamples = { search: {query: 'lead time'}, describe: {name: ''}, neighbors: {name: '', depth: 1}, path: {from: '', to: ''}, constraints_for: {name: ''}, validate: {action: '', inputs: {}}, where_is: {type: ''}, instances: {type: '', limit: 3}, summary: {}, query: {sql: 'select name from nodes limit 5'}, tables: {}, propose_change: {file: 'glossary.yaml', content: '', reason: ''}, match_file: {file_name: 'promo_sales.csv', columns: [{name: 'line_id', examples: ['L-1', 'L-2']}, {name: 'revenue', examples: ['43.20', '19.80']}]} };
function toolTemplate(){ const n = $('tool-name'); if (!n) return; const ex = JSON.parse(JSON.stringify(toolExamples[n.value] || {})); const t0 = (O.types[0]||{}).name || ''; for (const k of ['name','type','from']) if (k in ex && !ex[k]) ex[k] = t0; if ('to' in ex && !ex.to) ex.to = (O.types[1]||O.types[0]||{}).name || ''; if ('action' in ex) ex.action = (O.actions[0]||{}).action || ''; $('tool-args').value = JSON.stringify(ex, null, 2); }
async function runTool(){ let args = {}; try { args = JSON.parse($('tool-args').value || '{}'); } catch (e) { $('tool-out').style.display = 'block'; $('tool-out').textContent = 'arguments are not valid JSON: ' + e.message; return; } const r = await post(B + '/api/tool', { name: $('tool-name').value, arguments: args }); $('tool-out').style.display = 'block'; $('tool-out').textContent = (r.isError ? '[error] ' : '') + (r.content && r.content[0] ? r.content[0].text : JSON.stringify(r, null, 2)); if ($('tool-name').value === 'propose_change') { PR = await api(B + '/api/proposals'); await loadSummary(); } }

// --- data & sql ---
async function renderData(v){
  TABLES = await api(B + '/api/tables').catch(() => null);
  const sources = (O.sources||[]).map(s => `<span class="chip"><b>${esc(s.connection)}</b> · ${esc(s.kind)}</span>`).join('');
  const chips = TABLES && !TABLES.error ? (TABLES.tables||[]).map(n => `<span class="chip pick" onclick="useSql('select * from ${n} limit 20')">${n}</span>`).join('') + (TABLES.views||[]).map(x => `<span class="chip pick" title="${esc(x.source)}" onclick="useSql('select * from ${esc(x.view)} limit 20')">${esc(x.view)}</span>`).join('') : '<span style="color:var(--muted)">SQL is unavailable in this build.</span>';
  const skipped = TABLES ? Object.entries(TABLES.skipped||{}).map(([k, w]) => `<div style="font-size:12.5px;color:var(--muted)">✗ <b>${esc(k)}</b>: ${esc(w)}</div>`).join('') + Object.entries(TABLES.not_readable||{}).map(([k, w]) => `<div style="font-size:12.5px;color:var(--muted)">– <b>${esc(k)}</b>: ${esc(w)} is not read here</div>`).join('') : '';
  let out = '';
  if (ui.sqlOut) { const r = ui.sqlOut; out = r.error ? `<div class="verdict fail">${esc(r.error)}</div>` : `<div style="overflow:auto"><table><tr>${r.columns.map(c => `<th title="${esc(c.type)}">${esc(c.name)}</th>`).join('')}</tr>${r.rows.map(row => `<tr>${r.columns.map(c => `<td class="mono">${row[c.name]===null||row[c.name]===undefined?'<span style="color:var(--muted)">∅</span>':esc(typeof row[c.name]==='object'?JSON.stringify(row[c.name]):row[c.name])}</td>`).join('')}</tr>`).join('')}</table></div><div style="font-size:12px;color:var(--muted)">${r.row_count} row${r.row_count===1?'':'s'}${r.truncated?` (truncated at ${r.limit})`:''} · ${r.elapsed_ms} ms · DuckDB, read-only</div>`; }
  v.innerHTML = main(`<h1>Data &amp; SQL</h1><div class="desc">One SQL door across the ontology and every readable source. Read-only. The ontology is in <span class="mono">nodes, properties, edges, constraints, actions, sources</span>; every readable entity is a view named after it.</div><div>${sources}</div><div>${chips}</div>${skipped}<textarea id="sql-in" class="mono" rows="4" spellcheck="false">${esc(ui.sql)}</textarea><div class="row"><button class="primary" onclick="runSql()">Run</button><span style="font-size:12.5px;color:var(--muted)">⌘/Ctrl+Enter runs</span></div>${out}`);
  const t = $('sql-in'); t.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runSql(); });
}
function useSql(q){ ui.sql = q; runSql(); }
async function runSql(){ const t = $('sql-in'); if (t) ui.sql = t.value; ui.sqlOut = await post(B + '/api/query', { sql: ui.sql }); render(); }

// --- diagnostics ---
function renderDiagnostics(v){ v.innerHTML = main(`<h1>Diagnostics</h1>` + (O.diagnostics.map(d => `<div class="d ${d.level}">${d.level==='error'?'✗':'⚠'} ${esc(d.code)} ${esc(d.message)} <span style="color:var(--faint)">${esc(d.file)}</span></div>`).join('') || '<div class="empty">Clean</div>')); }

// --- YAML editor (whole file) and template-based creation ---
async function openEditor(file, name, kind){
  const text = await fetch(B + '/api/yaml?file=' + encodeURIComponent(file)).then(r => r.text());
  ui.editor = { file, name, kind, text, isNew: false, readOnly: ro() };
  if (route.screen !== 'entities' && route.screen !== 'actions') { $('view').innerHTML = main(editorHtml()); wireEditor(); } else render();
}
async function startNew(kind){
  if (ro()) { toast({ error: 'read-only: start with --allow-edit' }); return; }
  TEMPLATES = TEMPLATES || await api(B + '/api/templates');
  const t0 = (O.types[0]||{}).name || 'Customer';
  ui.editor = { file: '', name: '', kind, text: '', isNew: true, applies_to: t0, touched: false, constraintFile: (O.constraint_files||[])[0] || '' };
  fillTemplate();
  $('view').innerHTML = main(editorHtml()); wireEditor(); const n = $('new-name'); if (n) n.focus();
}
const kindFolder = { type: 'types', action: 'actions', relationship: 'relationships', source: 'sources', constraint: 'constraints', metric: 'logic', function: 'logic' };
function fillTemplate(){ const e = ui.editor; const name = e.name || { type: 'NewType', constraint: 'NEW-001', action: 'new_action', relationship: 'relates_to', source: 'new_source', metric: 'new_metric', function: 'new_function' }[e.kind]; e.text = (TEMPLATES[e.kind] || '').replaceAll('{{name}}', name).replaceAll('{{snake}}', snake(name)).replaceAll('{{applies_to}}', e.applies_to).replaceAll('{{input}}', snake(e.applies_to)); }
function editorHtml(){
  const e = ui.editor;
  if (e.readOnly) return viewerHtml(e);
  const head = e.isNew ? `<h1>New ${e.kind === 'constraint' ? 'guardrail' : e.kind}</h1><div class="desc">Fill in the template and save. ${e.kind === 'constraint' ? 'The rule is appended to the chosen file; the rest of that file stays exactly as it is.' : `The file goes to <code id="new-path">${esc(kindFolder[e.kind])}/${esc(snake(e.name||'<name>'))}.yaml</code>.`}</div><div class="form"><label>Name</label><input id="new-name" value="${esc(e.name)}" oninput="newNameChanged(this.value)">${e.kind==='constraint'?`<label>File</label><select onchange="ui.editor.constraintFile=this.value">${(O.constraint_files||[]).map(f => `<option ${e.constraintFile===f?'selected':''}>${esc(f)}</option>`).join('')}<option value="">new file: constraints/&lt;id&gt;.yaml</option></select>`:''}</div>` : `<div class="row"><h1>${esc(e.name)}<small>editing ${esc(e.file)}</small></h1></div>`;
  return head + `<div id="ed-diags"></div><textarea id="ed-text" class="yaml" spellcheck="false" ${e.isNew?'oninput="ui.editor.touched=true"':''}>${esc(e.text)}</textarea><div class="row"><button class="primary" onclick="${e.isNew?'saveNew()':'saveEdit()'}">Save</button><button onclick="cancelEdit()">Cancel</button><span style="font-size:12.5px;color:var(--muted)">⌘/Ctrl+S saves · the whole ontology is compiled with your text in place before anything is written</span><span style="flex:1"></span>${e.isNew?'':'<button class="danger" onclick="deleteFile()">Delete file</button>'}</div>`;
}
// read-only: the same file, readonly, with no Save or Delete; Copy YAML, Open in Files and (for a shipped space) copy it into a space of your own
function viewerHtml(e){
  const what = O.space && O.space.group === 'pack' ? 'pack' : 'example';
  const why = shipped()
    ? `This ${what} ships with Lorefile and stays read-only. ${canCopySpace() ? 'Copy it into a space of your own to change it.' : (SPACES && !SPACES.editable ? 'Start the server with <code>--allow-edit</code> to copy it into a space of your own and change it there.' : 'You can read and copy it here.')}`
    : `Read-only: this server was started without edit mode. Start it with <code>--allow-edit</code> to change it, or edit <code>${esc(O.dir)}/${esc(e.file)}</code> on disk.`;
  return `<div class="row"><h1>${esc(e.name)}<small>viewing ${esc(e.file)}</small></h1></div><div class="banner">${why}</div><textarea id="ed-text" class="yaml" spellcheck="false" readonly>${esc(e.text)}</textarea><div class="row"><button class="primary" onclick="copyYaml()">Copy YAML</button>${route.screen === 'files' ? '' : `<button onclick="ui.file=ui.editor.file;go('files')">Open in Files</button>`}${shipped() && canCopySpace() ? `<button onclick="ui.ns={name:'',from:${jq(O.space.id)}};go('new-space')">Copy this ${what} into a space</button>` : ''}<button onclick="cancelEdit()">Back</button></div>`;
}
async function copyYaml(){
  const e = ui.editor; if (!e) return;
  try { await navigator.clipboard.writeText(e.text); note('Copied ' + e.file + ' to the clipboard'); return; } catch (_) {}
  const t = $('ed-text'); t.focus(); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
  note(ok ? 'Copied ' + e.file + ' to the clipboard' : 'The browser blocked the clipboard. The text is selected: press ⌘/Ctrl+C.', !ok);
}
function wireEditor(){ const t = $('ed-text'); if (!t || ui.editor.readOnly) return; t.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); ui.editor.isNew ? saveNew() : saveEdit(); } if (e.key === 'Tab') { e.preventDefault(); const s = t.selectionStart, en = t.selectionEnd; t.value = t.value.slice(0, s) + '  ' + t.value.slice(en); t.selectionStart = t.selectionEnd = s + 2; ui.editor.touched = true; } }); }
function newNameChanged(v){ ui.editor.name = v.trim(); if (!ui.editor.touched) { fillTemplate(); $('ed-text').value = ui.editor.text; } const p = $('new-path'); if (p) p.textContent = `${kindFolder[ui.editor.kind]}/${snake(ui.editor.name||'<name>')}.yaml`; }
function showDiags(r){ const el = $('ed-diags'); if (!el) return; let h = r.error ? `<div class="d error">✗ ${esc(r.error)}</div>` : (!r.ok ? `<div class="d error">✗ Not saved: fix the ${r.errors} error${r.errors===1?'':'s'} below. Nothing was written.</div>` : ''); for (const d of (r.diagnostics||[])) h += `<div class="d ${d.level}">${d.level==='error'?'✗':'⚠'} ${esc(d.code)} ${esc(d.message)}${d.file?` <span style="opacity:.7">[${esc(d.file)}]</span>`:''}</div>`; el.innerHTML = h; }
async function saveEdit(){ const r = await post(B + '/api/edit', { file: ui.editor.file, content: $('ed-text').value }); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite(r); }
async function saveNew(){ const e = ui.editor; if (!e.name) { showDiags({ error: 'Give it a name first.' }); return; } const body = { kind: e.kind, name: e.name, content: $('ed-text').value }; if (e.kind === 'constraint' && e.constraintFile) body.file = e.constraintFile; const r = await post(B + '/api/create', body); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite(r); const dest = { type: ['entities', r.name || e.name], constraint: ['rules', r.name || e.name], action: ['actions', r.name || e.name], relationship: ['links', ''], source: ['sources', ''], metric: ['logic', ''], function: ['logic', ''] }[e.kind]; if (dest) go(dest[0], dest[1]); }
function cancelEdit(){ ui.editor = null; render(); }
async function deleteFile(){ const file = ui.editor.file; if (!confirm(`Delete ${file}?\n\nThe ontology is compiled without it first: anything that still refers to what it declares blocks the delete.`)) return; const r = await fetch(B + '/api/file?file=' + encodeURIComponent(file), { method: 'DELETE', headers: { 'X-Lorefile': 'write' } }).then(x => x.json()); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite({ ...r, summary: 'Deleted ' + file }); go(route.screen); }

boot();
</script>
