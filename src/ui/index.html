<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Lorefile</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1a1a1f;--muted:#6e6e78;--faint:#8e8e96;--line:#e6e6e2;--line2:#d9d9d4;--accent:#2b5cff;--accent-soft:#eef2ff;--block:#b91c1c;--block-bg:#fde8e8;--warn:#b45309;--warn-bg:#fef3e2;--info:#2b5cff;--info-bg:#e7eeff;--ok:#15803d;--ok-bg:#e8f5ec;--chip:#f0f0ed;--need:#fffbf3;--need-line:#f5d9a8;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--accent);text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;cursor:pointer;min-height:36px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.small{padding:5px 10px;min-height:30px;font-size:12.5px}button.danger{color:var(--block)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel)}
input.need,textarea.need{background:var(--need);border-color:var(--need-line)}
input:disabled,textarea:disabled,select:disabled{opacity:.55;background:var(--chip);cursor:default}
textarea{resize:vertical}
#app{display:grid;grid-template-rows:52px 1fr 34px;grid-template-columns:240px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
header .name{font-weight:700;font-size:15px}header select{max-width:260px;padding:5px 8px;min-height:32px;font-weight:600;font-size:13px}header .counts{color:var(--muted);font-size:13px}
.meter{width:120px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}.meter div{height:6px;background:var(--accent);border-radius:999px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.plain{background:var(--chip);color:var(--muted)}
nav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
nav input{width:100%;margin-bottom:8px;background:var(--bg)}
nav h4,.aside h4,.main h4{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
nav .step{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:none;border-radius:9px;padding:8px 10px;min-height:42px;width:100%}
nav .step:hover{background:var(--chip)}nav .step.active{background:var(--accent-soft)}
nav .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--line);color:var(--muted)}
nav .dot.ok{background:var(--ok);color:#fff}nav .dot.warn{background:var(--warn-bg);color:var(--warn)}nav .step.active .dot{background:var(--accent);color:#fff}
nav .t{font-weight:600;font-size:13.5px}nav .s{font-size:12px;color:var(--muted)}nav .s.warn{color:var(--warn)}
nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
nav .result{display:flex;gap:8px;align-items:center;text-align:left;background:transparent;border:none;border-radius:8px;padding:6px 8px;min-height:34px;width:100%;font-size:13px}nav .result:hover{background:var(--chip)}
nav .result small{width:52px;flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#view{display:flex;min-height:0;min-width:0}
.main{flex:1 1 auto;min-width:0;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.list{flex:0 0 240px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.list .item{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:none;border-radius:8px;padding:7px 8px;min-height:34px;width:100%;font-size:13.5px}
.list .item:hover{background:var(--chip)}.list .item.active{background:var(--accent);color:#fff}.list .item .gap{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.aside{flex:0 0 360px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.step-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:24px;font-weight:700}h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}h2{margin:0;font-size:18px}
.desc{color:var(--muted);max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.need{border-color:var(--need-line);background:var(--need)}.card.sel{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sev{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.sev.block{background:var(--block-bg);color:var(--block)}.sev.warn{background:var(--warn-bg);color:var(--warn)}.sev.info{background:var(--info-bg);color:var(--info)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0}
.chip.pick{cursor:pointer;border:1px solid var(--line2);background:var(--panel)}.chip.pick.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 12px}.tabs button.on{color:var(--ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:11.5px}
.mono{font-family:var(--mono);font-size:12.5px}code,pre{font-family:var(--mono);font-size:12px}
pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word}
code.block{display:block;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.cmd{display:flex;gap:8px;align-items:flex-start}.cmd code.block{flex:1 1 auto;min-width:0}.cmd button{flex:0 0 auto}
.col{display:flex;flex-direction:column;gap:6px}.hint{font-size:12.5px;color:var(--muted)}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center;max-width:720px}
.form label{font-size:12.5px;color:var(--muted)}
.verdict{padding:10px 12px;border-radius:10px;font-weight:600}.verdict.pass{background:var(--ok-bg);color:var(--ok)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}.verdict.fail{background:var(--block-bg);color:var(--block)}.verdict.unknown{background:var(--chip);color:var(--muted)}
.res{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.map{position:relative;overflow:auto;flex:1 1 auto;min-width:0;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:22px 22px}
.node{position:absolute;width:220px;height:70px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:4px;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05);z-index:1;min-height:0}
.node.sel{box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(0,0,0,.1)}.node b{font-size:14.5px}.node .tags{display:flex;gap:5px;flex-wrap:wrap}.node .tags span{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.edge{position:absolute;height:2px;background:var(--line2);transform-origin:0 50%;z-index:0}.edge.on{background:var(--ink)}
.elabel{position:absolute;width:88px;text-align:center;font-size:10.5px;color:var(--faint);background:var(--bg);border-radius:999px;padding:1px 0;z-index:0}.elabel.on{color:var(--ink)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
footer{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.toast{position:fixed;right:18px;bottom:48px;max-width:460px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13px;z-index:50}.toast.bad{border-left-color:var(--block)}
.d{font-family:var(--mono);font-size:12px;padding:3px 0}.d.error{color:var(--block)}.d.warning{color:var(--warn)}
.empty{color:var(--muted);padding:40px;text-align:center}
textarea.yaml{width:100%;min-height:420px;font-family:var(--mono);font-size:12.5px;line-height:1.5;tab-size:2}textarea.yaml[readonly]{background:var(--bg)}
.diff{font-family:var(--mono);font-size:12px;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}.diff .add{color:var(--ok)}.diff .del{color:var(--block)}.diff .file{font-weight:700;color:var(--ink);margin-top:8px}.diff .file:first-child{margin-top:0}.diff .hunk{color:var(--faint)}
.chip.agent{background:var(--warn-bg);color:var(--warn);font-weight:600}.chip.person{background:var(--ok-bg);color:var(--ok);font-weight:600}
.hist .when{font-size:12.5px;color:var(--muted);width:112px;flex:0 0 auto}.hist .chip{margin:0}.hist b{font-size:13.5px}
.grade{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.grade.proposed,.grade.changed{background:var(--warn-bg);color:var(--warn)}.grade.accepted{background:var(--info-bg);color:var(--info)}.grade.checked{background:var(--ok-bg);color:var(--ok)}
.sheet{position:fixed;inset:0;background:rgba(26,26,31,.28);display:flex;align-items:center;justify-content:center;z-index:40}.sheet .card{width:min(620px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="20" r="2"/><path d="M7 7l3 3M17 7l-3 3M12 15v3"/></svg></div>
    <select id="h-space" title="Which space (ontology) to show" onchange="switchSpace(this.value)"></select>
    <span class="name" id="h-name">…</span><span class="counts" id="h-counts"></span>
    <div class="row" style="gap:8px"><div class="meter"><div id="h-meter" style="width:0"></div></div><span style="font-size:12.5px;color:var(--muted)" id="h-ready"></span></div>
    <span style="flex:1"></span>
    <span id="h-mode" class="pill plain"></span>
    <button class="small" onclick="reload()">Reload</button>
    <a id="h-md" href="#" target="_blank"><button class="small">Summary.md</button></a>
  </header>
  <nav id="nav"></nav>
  <div id="view"></div>
  <footer id="footer"></footer>
</div>
<script>
// ---------- state ----------
let O = null, PR = { proposals: [], activity: [] }, DC = {}, TOOLS = null, TEMPLATES = null, TABLES = null, SPACES = null, AUTH = null;
// which space this page shows: /s/<id>/… ; B prefixes every API call so each space has its own URLs
const SP = (location.pathname.match(/^\/s\/([^/]+)/) || [])[1] || null;
const SPACE = SP ? decodeURIComponent(SP) : null;
const B = SP ? '/s/' + SP : '';
const spaceUrl = (id, hash) => '/s/' + encodeURIComponent(id) + '/' + (hash || '#map');
let route = { screen: 'map', arg: '' };
const ui = { mapSel: null, typeTab: 'fields', ruleFilter: 'all', ruleQuery: '', search: '', lf: { from: '', name: '', to: '', card: 'many-to-one', desc: '' }, rf: { name: '', applies: '', field: '', op: '==', value: '', rule: '', sev: 'block', why: '', who: '' }, tryInputs: {}, tryResult: null, sql: "select n.name, n.source_kind, count(c.id) as rules\nfrom nodes n left join constraints c on c.applies_to = n.name\ngroup by all order by rules desc", sqlOut: null, editor: null, newType: null, showProposal: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// a value written into a click handler is a JS string inside an HTML attribute, and the browser undoes the HTML
// escaping before it runs the script: so it is written as a JSON string first, then escaped. Never '${esc(x)}' there.
const jq = (s) => esc(JSON.stringify(String(s ?? '')));
// the same rule the server applies to a name (trust::by_words): a short plain name that never reads as an agent
const nameOk = (n) => n.length <= 60 && /^[\p{L}\p{N} .'_-]+$/u.test(n) && !/agent/i.test(n) && !n.toLowerCase().split(/\s+/).includes('via');
const NAME_RULE = 'Use up to 60 letters, digits, spaces and . - \' _ (no "agent" or "via"): the name is what history and trust.yaml will say.';
// a 401 means the sign-in went away (a new token, or signed out elsewhere): load again and the server shows its login screen
const api = async (p, opt) => { const r = await fetch(p, opt); if (r.status === 401) { location.reload(); return new Promise(() => {}); } return r.json(); };
// the name from Settings, kept in this browser, rides along with every write: "Priya via page" in history and trust.yaml
const ME = () => { try { return localStorage.getItem('lorefile-name') || ''; } catch (e) { return ''; } };
const post = (p, body) => api(p, { method:'POST', headers:{'Content-Type':'application/json', 'X-Lorefile':'write'}, body: JSON.stringify(ME() && body && typeof body === 'object' && !Array.isArray(body) ? Object.assign({ by: ME() }, body) : body) });
// --- grades: who stands behind each definition (trust.yaml) ---
const TR = (kind, name) => ((O.trust && O.trust.items) || []).find(x => x.kind === kind && x.name === name) || { grade: 'ungraded' };
const shortDate = (at) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(at || ''); return m ? `${Number(m[3])} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2]) - 1]}` : (at || ''); };
const whoSaid = (by) => { const n = String(by || '').split(' via ')[0].trim(); return !n || n === 'person' ? 'a person' : (n === 'agent' ? 'an agent' : n); };
function gradeChip(kind, name){
  const t = TR(kind, name); const say = esc(t.say || 'Nobody has said yet who stands behind this.');
  if (t.changed_since) return `<span class="grade changed" title="${say}">✎ changed since ${esc(t.changed_since.split(' ')[0])}</span>`;
  if (t.grade === 'checked') return `<span class="grade checked" title="${say}">● checked ${esc(shortDate(t.at))}</span>`;
  if (t.grade === 'accepted') return `<span class="grade accepted" title="${say}">accepted</span>`;
  if (t.grade === 'proposed') return `<span class="grade proposed" title="${say}">▲ proposed by an agent</span>`;
  return `<span class="grade" title="${say}">ungraded</span>`;
}
// the line under a chip: who and when, and for a check, which source and what was compared
function gradeNote(kind, name){
  const t = TR(kind, name);
  if (t.changed_since) return `<div class="hint">Changed since it was ${esc(t.changed_since)} (${esc(whoSaid(t.was_by))}); a person has to look again.</div>`;
  if (t.grade === 'checked') return `<div class="hint">${esc(whoSaid(t.by))} · ${esc(t.against || '')} · “${esc(t.note || '')}”</div>`;
  if (t.grade === 'proposed') return `<div class="hint">${esc(shortDate(t.at))} · ${esc(t.by)} · not reviewed</div>`;
  if (t.grade === 'accepted') return `<div class="hint">Accepted by ${esc(whoSaid(t.by))}, ${esc(shortDate(t.at))}</div>`;
  return '';
}
function gradeButtons(kind, name){
  if (ro()) return '';
  const t = TR(kind, name); const k = jq(kind), n = jq(name);
  let h = '';
  if (t.grade !== 'accepted' && t.grade !== 'checked') h += `<button class="small" onclick="looksRight(${k},${n})" title="Say you stand behind it: saved as accepted by ${esc(ME() || 'a person')}">Looks right</button>`;
  if (kind !== 'term' && (t.grade === 'accepted' || t.grade === 'checked')) h += `<button class="small" onclick="openCheck(${k},${n})">${t.grade === 'checked' ? 'Check again…' : 'Mark as checked…'}</button>`;
  return h;
}
async function looksRight(kind, name){ const r = await post(B + '/api/trust', { op: 'accept', kind, name }); await afterWrite({ ...r, summary: r.written ? `Accepted ${kind === 'term' ? 'the word' : kind} ${name}` : undefined }); }
function openCheck(kind, name){ const sources = (O.sources || []).map(s => s.connection); ui.check = { kind, name, against: (ui.check && ui.check.against) || sources[0] || '', note: '' }; renderSheet(); }
function renderSheet(){
  let el = $('sheet'); if (!ui.check) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheet'; document.body.appendChild(el); }
  const c = ui.check; const what = c.kind === 'binding' ? `the data binding of ${c.name}` : `${c.kind} ${c.name}`;
  el.innerHTML = `<div class="card"><b style="font-size:15px">Mark ${esc(what)} as checked</b><div style="font-size:13px">You are saying: I ran this definition against real rows and the result was right. Lorefile records your word; it does not run anything.</div><div class="form"><label>Against which source</label><select id="ck-against">${(O.sources || []).map(s => `<option ${s.connection===c.against?'selected':''}>${esc(s.connection)}</option>`).join('')}</select><label>What did you compare</label><textarea id="ck-note" rows="2" placeholder="e.g. 412 paid orders for 16–22 Nov, the same as Shopify's own report">${esc(c.note)}</textarea><label>Your name</label><input id="ck-name" value="${esc(ME())}" placeholder="shown on what you check"></div><div id="ck-err"></div><div class="row" style="justify-content:flex-end"><button onclick="ui.check=null;renderSheet()">Cancel</button><button class="primary" onclick="saveCheck()">Mark as checked</button></div></div>`;
}
async function saveCheck(){
  const c = ui.check; const name = $('ck-name').value.trim();
  if (name && !nameOk(name)) { $('ck-err').innerHTML = `<div class="d error">✗ That name cannot be used. ${esc(NAME_RULE)}</div>`; return; }
  try { if (name) localStorage.setItem('lorefile-name', name); else localStorage.removeItem('lorefile-name'); } catch (e) {}
  // sent as typed, so it counts even where the browser keeps no storage; an empty one says "person via page"
  const r = await post(B + '/api/trust', { op: 'check', kind: c.kind, name: c.name, against: $('ck-against').value, note: $('ck-note').value, by: name });
  if (!r.written) { const why = r.error || (r.diagnostics || []).filter(d => d.level === 'error').map(d => d.message).join('; ') || 'Not saved'; $('ck-err').innerHTML = `<div class="d error">✗ ${esc(why)}</div>`; return; }
  const against = $('ck-against').value;
  ui.check = null; renderSheet(); await afterWrite({ ...r, summary: `Checked ${c.kind} ${c.name} against ${against}` });
}
async function vouchAll(){
  const tc = (O.trust && O.trust.counts) || {}; const n = (tc.ungraded || 0) - (tc.changed || 0);
  if (!confirm(`Vouch for ${n} ungraded definition${n===1?'':'s'}?\n\nEach metric, data binding, glossary word and guardrail nobody has graded yet is saved as accepted by ${ME() || 'a person'}, in one change. What an agent proposed, and what changed since a person graded it, still need a look each.`)) return;
  const r = await post(B + '/api/trust', { op: 'vouch_all' }); await afterWrite({ ...r, summary: r.written ? `Vouched for ${r.name} definitions` : undefined });
}
const snake = (s) => String(s).replace(/([a-z0-9])([A-Z])/g, '$1_$2').replace(/[-\s]+/g, '_').toLowerCase();
const human = (s) => String(s).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const sevLabel = { block: 'stop', warn: 'warn', info: 'note' };
const sev = (s) => `<span class="sev ${s}">${sevLabel[s] || s}</span>`;
const owner = (o) => o ? human(String(o).split('@')[0]) + (o.includes('@') ? ' team' : '') : 'no one named yet';
const PALETTE = ['#2b5cff', '#0f766e', '#7c3aed', '#db2777', '#b45309', '#0369a1', '#4d7c0f', '#9f1239'];
const domainColor = (d) => { const i = (O.domains || []).findIndex(x => x.name === d); return i >= 0 ? PALETTE[i % PALETTE.length] : '#6e6e78'; };
const describe = async (name) => DC[name] || (DC[name] = await api(B + '/api/describe?name=' + encodeURIComponent(name)));

// ---------- derived facts ----------
function facts(){
  const types = O.types || [], rels = O.relationships || [], rules = O.constraints || [];
  const gapTypes = types.filter(t => t.described < t.fields);
  const unbound = types.filter(t => !t.has_source);

const runsText = (r) => !r ? 'nowhere declared yet' : r.kind === 'mcp' ? `calls tool ${r.tool} on the ${r.server} MCP server` + (r.args && Object.keys(r.args).length ? ' with ' + JSON.stringify(r.args) : '') : r.kind === 'http' ? `${r.method || 'POST'} ${r.url}` : r.kind === 'manual' ? 'a person does it; the agent records the request' : r.kind;
const ioText = (m) => Object.entries(m || {}).map(([k, t]) => `${k}: ${t}`).join(', ') || 'nothing';
const srcOf = (m) => m.source ? m.source.connection : ((m.variants || []).map(x => x.source.connection).join(' and ') || 'sql');
function renderLogic(v){
  const f = facts();
  const recipe = (s) => s ? [esc(s.connection), s.tool ? 'tool ' + esc(s.tool) + (s.params && Object.keys(s.params).length ? ' ' + esc(JSON.stringify(s.params)) : '') : '', s.table ? esc(s.table) : '', s.filter ? 'where ' + esc(s.filter) : '', s.measure ? esc(s.measure) : ''].filter(Boolean).join(' · ') : '';

  const mcards = f.metrics.map(m => `<div class="card ${m.owner?'':'need'}"><div class="row"><span class="mono" style="font-weight:700;font-size:14px">${esc(m.name)}</span>${m.grain?`<span class="chip">per ${esc(m.grain)}</span>`:''}${m.basis?`<span class="chip" title="What kind of number this is">${esc(m.basis)}</span>`:''}<span style="margin-left:auto;font-size:12.5px;color:${m.owner?'var(--muted)':'var(--warn)'}">${m.owner ? 'owned by ' + esc(owner(m.owner)) : 'no owner yet'}</span>${gradeChip('metric', m.name)}</div>${gradeNote('metric', m.name)}<div style="font-size:13px">${esc(m.description || 'No description yet.')}</div>${m.source ? `<div class="mono" style="font-size:12px;color:var(--muted)">${recipe(m.source)}</div>` : ''}${(m.variants||[]).map(x => `<div style="font-size:12.5px;padding-left:10px;border-left:2px solid var(--line)"><span class="chip">when ${esc(x.when)}</span>${x.basis?`<span class="chip">${esc(x.basis)}</span>`:''} ${esc(x.description||'')}<div class="mono" style="font-size:12px;color:var(--muted)">${recipe(x.source)}</div></div>`).join('')}${m.sql ? `<pre>${esc(m.sql)}</pre>` : ''}${m.caveats ? `<div style="font-size:12.5px;color:var(--muted)">Caveat: ${esc(m.caveats)}</div>` : ''}<div class="row"><span class="mono" style="font-size:11.5px;color:var(--faint)">${esc(m.file)}</span><span style="flex:1"></span>${gradeButtons('metric', m.name)}${yamlBtn(m.file, m.name, 'metric')}</div></div>`).join('');
  const fcards = f.fns.map(fn => `<div class="card ${fn.runs?'':'need'}"><div class="row"><span class="mono" style="font-weight:700;font-size:14px">${esc(fn.name)}</span><span class="chip">${esc((fn.runs||{}).kind || 'runs where?')}</span><span style="margin-left:auto;font-size:12.5px;color:${fn.owner?'var(--muted)':'var(--warn)'}">${fn.owner ? 'owned by ' + esc(owner(fn.owner)) : 'no owner yet'}</span></div><div style="font-size:13px">${esc(fn.description || 'No description yet.')}</div><div class="mono" style="font-size:12px"><span style="color:var(--muted)">in</span> ${esc(ioText(fn.inputs))} <span style="color:var(--muted)">→ out</span> ${esc(ioText(fn.outputs))}</div><div style="font-size:12.5px;color:var(--muted)">How: ${esc(runsText(fn.runs))}${(fn.may_be_called_by||[]).length ? ' · may be called by ' + esc(fn.may_be_called_by.join(', ')) : ''}</div>${fn.caveats ? `<div style="font-size:12.5px;color:var(--muted)">Caveat: ${esc(fn.caveats)}</div>` : ''}<div class="row"><span class="mono" style="font-size:11.5px;color:var(--faint)">${esc(fn.file)}</span><span style="flex:1"></span>${yamlBtn(fn.file, fn.name, 'function')}</div></div>`).join('');
  const emptyM = f.metrics.length ? '' : `<div class="card need"><b>No metrics yet</b><div style="font-size:13px;color:var(--muted)">Start with <span class="mono">success</span>: the one number this business is run on, and where it comes from. The first time an agent does the reporting it can save this for you with <span class="mono">propose_patch</span>; you accept it under Agents.</div></div>`;
  const emptyF = f.fns.length ? '' : `<div class="card need"><b>No functions yet</b><div style="font-size:13px;color:var(--muted)">A function is a contract plus a pointer: inputs, outputs, and the MCP tool or endpoint that does the work. Forecasting, cancelling an order, moving a budget. Agents read it to know what to call.</div></div>`;
  v.innerHTML = main(roBanner() + stepHead(4, 'Logic', 'The numbers and the operations of this business, written down once so every agent uses the same ones.') + intro
    + `<h4 style="padding:0">Numbers · ${f.metrics.length} metric${f.metrics.length===1?'':'s'}</h4>` + emptyM + mcards + `<div><button class="small" ${ro()?'disabled':''} onclick="startNew('metric')">+ New metric</button></div>`
    + `<h4 style="padding:0">Operations · ${f.fns.length} function${f.fns.length===1?'':'s'}</h4>` + emptyF + fcards + `<div><button class="small" ${ro()?'disabled':''} onclick="startNew('function')">+ New function</button></div>`);
}

let USAGE_Q = [];
function renderUsage(v){

  const q = [];
  if (t0) q.push(['Understand', `What is a ${t0}, and what do we track about it?`, `describe("${t0}")`, { name: 'describe', arguments: { name: t0 } }]);

// --- history ---
function when(iso){
  const d = new Date(iso); if (isNaN(d)) return iso || '';
  const now = new Date(), day = (x) => x.toDateString(), hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (day(d) === day(now)) return 'today ' + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (day(d) === day(y)) return 'yesterday ' + hm;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ' ' + hm;
}
// git's unified diff, in the inbox card's colours: a file name, then + and - lines
function gitDiffHtml(text){
  if (!(text || '').trim()) return '(no file in this space changed)';
  const out = [];
  for (const l of text.replace(/\n$/, '').split('\n')) {
    const f = l.match(/^diff --git a\/(.*) b\/(.*)$/);
    if (f) { out.push({ cls: 'file', text: f[2] }); continue; }
    if (/^new file mode/.test(l)) { const last = out[out.length - 1]; if (last && last.cls === 'file') last.text += ' (new)'; continue; }
    if (/^deleted file mode/.test(l)) { const last = out[out.length - 1]; if (last && last.cls === 'file') last.text += ' (removed)'; continue; }
    if (/^(index |--- |\+\+\+ |old mode|new mode|similarity|rename |Binary files)/.test(l)) continue;
    if (l.startsWith('@@')) { out.push({ cls: 'hunk', text: l.replace(/^(@@[^@]*@@).*$/, '$1') }); continue; }
    out.push({ cls: l[0] === '+' ? 'add' : (l[0] === '-' ? 'del' : ''), text: l });
  }
  return out.map(x => `<div class="${x.cls}">${esc(x.text)}</div>`).join('');
}

function diffHtml(before, after){
  const a = (before||'').split('\n'), b = (after||'').split('\n'); const sa = new Set(a), sb = new Set(b);
  const out = []; let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (i < a.length && j < b.length && a[i] === b[j]) { out.push(['=', a[i]]); i++; j++; }
    else if (j < b.length && !sa.has(b[j])) { out.push(['+', b[j]]); j++; }
    else if (i < a.length && !sb.has(a[i])) { out.push(['-', a[i]]); i++; }
    else if (j < b.length) { out.push(['+', b[j]]); j++; } else { out.push(['-', a[i]]); i++; }
  }
  const changed = out.filter(x => x[0] !== '=').length;
  const keep = []; out.forEach((x, k) => { if (x[0] !== '=' || out.slice(Math.max(0,k-2), k+3).some(y => y[0] !== '=')) keep.push(x); });
  if (!changed) return '(identical to the current file)';
  return keep.map(([m, l]) => `<div class="${m==='+'?'add':(m==='-'?'del':'')}">${m==='='?' ':m} ${esc(l)}</div>`).join('');
}
async function decide(id, what){ const p = (PR.proposals || []).find(x => x.id === id) || {}; const r = await post(B + '/api/proposals/' + what, { id }); if (what === 'accept') await afterWrite({ ...r, summary: r.written ? (p.check ? `Marked ${p.check.kind} ${p.check.name} as checked` : 'Accepted and written to ' + r.file) : undefined }); else { toast({ written: true, summary: 'Set aside' }); } render(); }
const toolExamples = { search: {query: 'lead time'}, describe: {name: ''}, neighbors: {name: '', depth: 1}, path: {from: '', to: ''}, constraints_for: {name: ''}, validate: {action: '', inputs: {}}, where_is: {type: ''}, instances: {type: '', limit: 3}, summary: {}, query: {sql: 'select name from nodes limit 5'}, tables: {}, propose_change: {file: 'glossary.yaml', content: '', reason: ''} };
function toolTemplate(){ const n = $('tool-name'); if (!n) return; const ex = JSON.parse(JSON.stringify(toolExamples[n.value] || {})); const t0 = (O.types[0]||{}).name || ''; for (const k of ['name','type','from']) if (k in ex && !ex[k]) ex[k] = t0; if ('to' in ex && !ex.to) ex.to = (O.types[1]||O.types[0]||{}).name || ''; if ('action' in ex) ex.action = (O.actions[0]||{}).action || ''; $('tool-args').value = JSON.stringify(ex, null, 2); }
async function runTool(){ let args = {}; try { args = JSON.parse($('tool-args').value || '{}'); } catch (e) { $('tool-out').style.display = 'block'; $('tool-out').textContent = 'arguments are not valid JSON: ' + e.message; return; } const r = await post(B + '/api/tool', { name: $('tool-name').value, arguments: args }); $('tool-out').style.display = 'block'; $('tool-out').textContent = (r.isError ? '[error] ' : '') + (r.content && r.content[0] ? r.content[0].text : JSON.stringify(r, null, 2)); if ($('tool-name').value === 'propose_change') { PR = await api(B + '/api/proposals'); await loadSummary(); } }

// --- data & sql ---
async function renderData(v){
  TABLES = await api(B + '/api/tables').catch(() => null);
  const sources = (O.sources||[]).map(s => `<span class="chip"><b>${esc(s.connection)}</b> · ${esc(s.kind)}</span>`).join('');
  const chips = TABLES && !TABLES.error ? (TABLES.tables||[]).map(n => `<span class="chip pick" onclick="useSql('select * from ${n} limit 20')">${n}</span>`).join('') + (TABLES.views||[]).map(x => `<span class="chip pick" title="${esc(x.source)}" onclick="useSql('select * from ${esc(x.view)} limit 20')">${esc(x.view)}</span>`).join('') : '<span style="color:var(--muted)">SQL is unavailable in this build.</span>';
  const skipped = TABLES ? Object.entries(TABLES.skipped||{}).map(([k, w]) => `<div style="font-size:12.5px;color:var(--muted)">✗ <b>${esc(k)}</b>: ${esc(w)}</div>`).join('') + Object.entries(TABLES.not_readable||{}).map(([k, w]) => `<div style="font-size:12.5px;color:var(--muted)">– <b>${esc(k)}</b>: ${esc(w)} is not read here</div>`).join('') : '';
  let out = '';
  if (ui.sqlOut) { const r = ui.sqlOut; out = r.error ? `<div class="verdict fail">${esc(r.error)}</div>` : `<div style="overflow:auto"><table><tr>${r.columns.map(c => `<th title="${esc(c.type)}">${esc(c.name)}</th>`).join('')}</tr>${r.rows.map(row => `<tr>${r.columns.map(c => `<td class="mono">${row[c.name]===null||row[c.name]===undefined?'<span style="color:var(--muted)">∅</span>':esc(typeof row[c.name]==='object'?JSON.stringify(row[c.name]):row[c.name])}</td>`).join('')}</tr>`).join('')}</table></div><div style="font-size:12px;color:var(--muted)">${r.row_count} row${r.row_count===1?'':'s'}${r.truncated?` (truncated at ${r.limit})`:''} · ${r.elapsed_ms} ms · DuckDB, read-only</div>`; }
  v.innerHTML = main(`<h1>Data &amp; SQL</h1><div class="desc">One SQL door across the ontology and every readable source. Read-only. The ontology is in <span class="mono">nodes, properties, edges, constraints, actions, sources</span>; every readable entity is a view named after it.</div><div>${sources}</div><div>${chips}</div>${skipped}<textarea id="sql-in" class="mono" rows="4" spellcheck="false">${esc(ui.sql)}</textarea><div class="row"><button class="primary" onclick="runSql()">Run</button><span style="font-size:12.5px;color:var(--muted)">⌘/Ctrl+Enter runs</span></div>${out}`);
  const t = $('sql-in'); t.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runSql(); });
}
function useSql(q){ ui.sql = q; runSql(); }
async function runSql(){ const t = $('sql-in'); if (t) ui.sql = t.value; ui.sqlOut = await post(B + '/api/query', { sql: ui.sql }); render(); }

// --- diagnostics ---
function renderDiagnostics(v){ v.innerHTML = main(`<h1>Diagnostics</h1>` + (O.diagnostics.map(d => `<div class="d ${d.level}">${d.level==='error'?'✗':'⚠'} ${esc(d.code)} ${esc(d.message)} <span style="color:var(--faint)">${esc(d.file)}</span></div>`).join('') || '<div class="empty">Clean</div>')); }

// --- YAML editor (whole file) and template-based creation ---
async function openEditor(file, name, kind){
  const text = await fetch(B + '/api/yaml?file=' + encodeURIComponent(file)).then(r => r.text());
  ui.editor = { file, name, kind, text, isNew: false, readOnly: ro() };
  if (route.screen !== 'entities' && route.screen !== 'actions') { $('view').innerHTML = main(editorHtml()); wireEditor(); } else render();
}
async function startNew(kind){
  if (ro()) { toast({ error: 'read-only: start with --allow-edit' }); return; }
  TEMPLATES = TEMPLATES || await api(B + '/api/templates');
  const t0 = (O.types[0]||{}).name || 'Customer';
  ui.editor = { file: '', name: '', kind, text: '', isNew: true, applies_to: t0, touched: false, constraintFile: (O.constraint_files||[])[0] || '' };
  fillTemplate();
  $('view').innerHTML = main(editorHtml()); wireEditor(); const n = $('new-name'); if (n) n.focus();
}
const kindFolder = { type: 'types', action: 'actions', relationship: 'relationships', source: 'sources', constraint: 'constraints', metric: 'logic', function: 'logic' };
function fillTemplate(){ const e = ui.editor; const name = e.name || { type: 'NewType', constraint: 'NEW-001', action: 'new_action', relationship: 'relates_to', source: 'new_source', metric: 'new_metric', function: 'new_function' }[e.kind]; e.text = (TEMPLATES[e.kind] || '').replaceAll('{{name}}', name).replaceAll('{{snake}}', snake(name)).replaceAll('{{applies_to}}', e.applies_to).replaceAll('{{input}}', snake(e.applies_to)); }
function editorHtml(){
  const e = ui.editor;
  if (e.readOnly) return viewerHtml(e);
  const head = e.isNew ? `<h1>New ${e.kind === 'constraint' ? 'guardrail' : e.kind}</h1><div class="desc">Fill in the template and save. ${e.kind === 'constraint' ? 'The rule is appended to the chosen file; the rest of that file stays exactly as it is.' : `The file goes to <code id="new-path">${esc(kindFolder[e.kind])}/${esc(snake(e.name||'<name>'))}.yaml</code>.`}</div><div class="form"><label>Name</label><input id="new-name" value="${esc(e.name)}" oninput="newNameChanged(this.value)">${e.kind==='constraint'?`<label>File</label><select onchange="ui.editor.constraintFile=this.value">${(O.constraint_files||[]).map(f => `<option ${e.constraintFile===f?'selected':''}>${esc(f)}</option>`).join('')}<option value="">new file: constraints/&lt;id&gt;.yaml</option></select>`:''}</div>` : `<div class="row"><h1>${esc(e.name)}<small>editing ${esc(e.file)}</small></h1></div>`;
  return head + `<div id="ed-diags"></div><textarea id="ed-text" class="yaml" spellcheck="false" ${e.isNew?'oninput="ui.editor.touched=true"':''}>${esc(e.text)}</textarea><div class="row"><button class="primary" onclick="${e.isNew?'saveNew()':'saveEdit()'}">Save</button><button onclick="cancelEdit()">Cancel</button><span style="font-size:12.5px;color:var(--muted)">⌘/Ctrl+S saves · the whole ontology is compiled with your text in place before anything is written</span><span style="flex:1"></span>${e.isNew?'':'<button class="danger" onclick="deleteFile()">Delete file</button>'}</div>`;
}
// read-only: the same file, readonly, with no Save or Delete; Copy YAML, Open in Files and (for a shipped space) copy it into a space of your own
function viewerHtml(e){
  const what = O.space && O.space.group === 'pack' ? 'pack' : 'example';
  const why = shipped()
    ? `This ${what} ships with Lorefile and stays read-only. ${canCopySpace() ? 'Copy it into a space of your own to change it.' : (SPACES && !SPACES.editable ? 'Start the server with <code>--allow-edit</code> to copy it into a space of your own and change it there.' : 'You can read and copy it here.')}`
    : `Read-only: this server was started without edit mode. Start it with <code>--allow-edit</code> to change it, or edit <code>${esc(O.dir)}/${esc(e.file)}</code> on disk.`;
  return `<div class="row"><h1>${esc(e.name)}<small>viewing ${esc(e.file)}</small></h1></div><div class="banner">${why}</div><textarea id="ed-text" class="yaml" spellcheck="false" readonly>${esc(e.text)}</textarea><div class="row"><button class="primary" onclick="copyYaml()">Copy YAML</button>${route.screen === 'files' ? '' : `<button onclick="ui.file=ui.editor.file;go('files')">Open in Files</button>`}${shipped() && canCopySpace() ? `<button onclick="ui.ns={name:'',from:${jq(O.space.id)}};go('new-space')">Copy this ${what} into a space</button>` : ''}<button onclick="cancelEdit()">Back</button></div>`;
}
async function copyYaml(){
  const e = ui.editor; if (!e) return;
  try { await navigator.clipboard.writeText(e.text); note('Copied ' + e.file + ' to the clipboard'); return; } catch (_) {}
  const t = $('ed-text'); t.focus(); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
  note(ok ? 'Copied ' + e.file + ' to the clipboard' : 'The browser blocked the clipboard. The text is selected: press ⌘/Ctrl+C.', !ok);
}
function wireEditor(){ const t = $('ed-text'); if (!t || ui.editor.readOnly) return; t.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); ui.editor.isNew ? saveNew() : saveEdit(); } if (e.key === 'Tab') { e.preventDefault(); const s = t.selectionStart, en = t.selectionEnd; t.value = t.value.slice(0, s) + '  ' + t.value.slice(en); t.selectionStart = t.selectionEnd = s + 2; ui.editor.touched = true; } }); }
function newNameChanged(v){ ui.editor.name = v.trim(); if (!ui.editor.touched) { fillTemplate(); $('ed-text').value = ui.editor.text; } const p = $('new-path'); if (p) p.textContent = `${kindFolder[ui.editor.kind]}/${snake(ui.editor.name||'<name>')}.yaml`; }
function showDiags(r){ const el = $('ed-diags'); if (!el) return; let h = r.error ? `<div class="d error">✗ ${esc(r.error)}</div>` : (!r.ok ? `<div class="d error">✗ Not saved: fix the ${r.errors} error${r.errors===1?'':'s'} below. Nothing was written.</div>` : ''); for (const d of (r.diagnostics||[])) h += `<div class="d ${d.level}">${d.level==='error'?'✗':'⚠'} ${esc(d.code)} ${esc(d.message)}${d.file?` <span style="opacity:.7">[${esc(d.file)}]</span>`:''}</div>`; el.innerHTML = h; }
async function saveEdit(){ const r = await post(B + '/api/edit', { file: ui.editor.file, content: $('ed-text').value }); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite(r); }
async function saveNew(){ const e = ui.editor; if (!e.name) { showDiags({ error: 'Give it a name first.' }); return; } const body = { kind: e.kind, name: e.name, content: $('ed-text').value }; if (e.kind === 'constraint' && e.constraintFile) body.file = e.constraintFile; const r = await post(B + '/api/create', body); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite(r); const dest = { type: ['entities', r.name || e.name], constraint: ['rules', r.name || e.name], action: ['actions', r.name || e.name], relationship: ['links', ''], source: ['sources', ''], metric: ['logic', ''], function: ['logic', ''] }[e.kind]; if (dest) go(dest[0], dest[1]); }
function cancelEdit(){ ui.editor = null; render(); }
async function deleteFile(){ const file = ui.editor.file; if (!confirm(`Delete ${file}?\n\nThe ontology is compiled without it first: anything that still refers to what it declares blocks the delete.`)) return; const r = await fetch(B + '/api/file?file=' + encodeURIComponent(file), { method: 'DELETE', headers: { 'X-Lorefile': 'write' } }).then(x => x.json()); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite({ ...r, summary: 'Deleted ' + file }); go(route.screen); }

boot();
</script>
