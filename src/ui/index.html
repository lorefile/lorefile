<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Stella Ontology</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1a1a1f;--muted:#6e6e78;--faint:#8e8e96;--line:#e6e6e2;--line2:#d9d9d4;--accent:#2b5cff;--accent-soft:#eef2ff;--block:#b91c1c;--block-bg:#fde8e8;--warn:#b45309;--warn-bg:#fef3e2;--info:#2b5cff;--info-bg:#e7eeff;--ok:#15803d;--ok-bg:#e8f5ec;--chip:#f0f0ed;--need:#fffbf3;--need-line:#f5d9a8;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--accent);text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:7px 12px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;cursor:pointer;min-height:36px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.small{padding:5px 10px;min-height:30px;font-size:12.5px}button.danger{color:var(--block)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel)}
input.need,textarea.need{background:var(--need);border-color:var(--need-line)}
input:disabled,textarea:disabled,select:disabled{opacity:.55;background:var(--chip);cursor:default}
textarea{resize:vertical}
#app{display:grid;grid-template-rows:52px 1fr 34px;grid-template-columns:240px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
header .name{font-weight:700;font-size:15px}header select{max-width:260px;padding:5px 8px;min-height:32px;font-weight:600;font-size:13px}header .counts{color:var(--muted);font-size:13px}
.meter{width:120px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}.meter div{height:6px;background:var(--accent);border-radius:999px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.plain{background:var(--chip);color:var(--muted)}
nav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
nav input{width:100%;margin-bottom:8px;background:var(--bg)}
nav h4,.aside h4,.main h4{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
nav .step{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:none;border-radius:9px;padding:8px 10px;min-height:42px;width:100%}
nav .step:hover{background:var(--chip)}nav .step.active{background:var(--accent-soft)}
nav .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--line);color:var(--muted)}
nav .dot.ok{background:var(--ok);color:#fff}nav .dot.warn{background:var(--warn-bg);color:var(--warn)}nav .step.active .dot{background:var(--accent);color:#fff}
nav .t{font-weight:600;font-size:13.5px}nav .s{font-size:12px;color:var(--muted)}nav .s.warn{color:var(--warn)}
nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
nav .result{display:flex;gap:8px;align-items:center;text-align:left;background:transparent;border:none;border-radius:8px;padding:6px 8px;min-height:34px;width:100%;font-size:13px}nav .result:hover{background:var(--chip)}
nav .result small{width:52px;flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#view{display:flex;min-height:0;min-width:0}
.main{flex:1 1 auto;min-width:0;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.list{flex:0 0 240px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.list .item{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:none;border-radius:8px;padding:7px 8px;min-height:34px;width:100%;font-size:13.5px}
.list .item:hover{background:var(--chip)}.list .item.active{background:var(--accent);color:#fff}.list .item .gap{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.aside{flex:0 0 360px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.step-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:24px;font-weight:700}h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}h2{margin:0;font-size:18px}
.desc{color:var(--muted);max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.need{border-color:var(--need-line);background:var(--need)}.card.sel{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sev{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.sev.block{background:var(--block-bg);color:var(--block)}.sev.warn{background:var(--warn-bg);color:var(--warn)}.sev.info{background:var(--info-bg);color:var(--info)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0}
.chip.pick{cursor:pointer;border:1px solid var(--line2);background:var(--panel)}.chip.pick.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 12px}.tabs button.on{color:var(--ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:11.5px}
.mono{font-family:var(--mono);font-size:12.5px}code,pre{font-family:var(--mono);font-size:12px}
pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word}
code.block{display:block;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center;max-width:720px}
.form label{font-size:12.5px;color:var(--muted)}
.verdict{padding:10px 12px;border-radius:10px;font-weight:600}.verdict.pass{background:var(--ok-bg);color:var(--ok)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}.verdict.fail{background:var(--block-bg);color:var(--block)}
.res{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.map{position:relative;overflow:auto;flex:1 1 auto;min-width:0;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:22px 22px}
.node{position:absolute;width:220px;height:70px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:4px;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05);z-index:1;min-height:0}
.node.sel{box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(0,0,0,.1)}.node b{font-size:14.5px}.node .tags{display:flex;gap:5px;flex-wrap:wrap}.node .tags span{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.edge{position:absolute;height:2px;background:var(--line2);transform-origin:0 50%;z-index:0}.edge.on{background:var(--ink)}
.elabel{position:absolute;width:88px;text-align:center;font-size:10.5px;color:var(--faint);background:var(--bg);border-radius:999px;padding:1px 0;z-index:0}.elabel.on{color:var(--ink)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
footer{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.toast{position:fixed;right:18px;bottom:48px;max-width:460px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13px;z-index:50}.toast.bad{border-left-color:var(--block)}
.d{font-family:var(--mono);font-size:12px;padding:3px 0}.d.error{color:var(--block)}.d.warning{color:var(--warn)}
.empty{color:var(--muted);padding:40px;text-align:center}
textarea.yaml{width:100%;min-height:420px;font-family:var(--mono);font-size:12.5px;line-height:1.5;tab-size:2}
.diff{font-family:var(--mono);font-size:12px;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}.diff .add{color:var(--ok)}.diff .del{color:var(--block)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="20" r="2"/><path d="M7 7l3 3M17 7l-3 3M12 15v3"/></svg></div>
    <select id="h-space" title="Which space (ontology) to show" onchange="switchSpace(this.value)"></select>
    <span class="name" id="h-name">…</span><span class="counts" id="h-counts"></span>
    <div class="row" style="gap:8px"><div class="meter"><div id="h-meter" style="width:0"></div></div><span style="font-size:12.5px;color:var(--muted)" id="h-ready"></span></div>
    <span style="flex:1"></span>
    <span id="h-mode" class="pill plain"></span>
    <button class="small" onclick="reload()">Reload</button>
    <a id="h-md" href="#" target="_blank"><button class="small">Summary.md</button></a>
  </header>
  <nav id="nav"></nav>
  <div id="view"></div>
  <footer id="footer"></footer>
</div>
<script>
// ---------- state ----------
let O = null, PR = { proposals: [], activity: [] }, DC = {}, TOOLS = null, TEMPLATES = null, TABLES = null, SPACES = null;
// which space this page shows: /s/<id>/… ; B prefixes every API call so each space has its own URLs
const SP = (location.pathname.match(/^\/s\/([^/]+)/) || [])[1] || null;
const SPACE = SP ? decodeURIComponent(SP) : null;
const B = SP ? '/s/' + SP : '';
const spaceUrl = (id, hash) => '/s/' + encodeURIComponent(id) + '/' + (hash || '#map');
let route = { screen: 'map', arg: '' };
const ui = { mapSel: null, typeTab: 'fields', ruleFilter: 'all', ruleQuery: '', search: '', lf: { from: '', name: '', to: '', card: 'many-to-one', desc: '' }, rf: { name: '', applies: '', field: '', op: '==', value: '', rule: '', sev: 'block', why: '', who: '' }, tryInputs: {}, tryResult: null, sql: "select n.name, n.source_kind, count(c.id) as rules\nfrom nodes n left join constraints c on c.applies_to = n.name\ngroup by all order by rules desc", sqlOut: null, editor: null, newType: null, showProposal: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (p, opt) => { const r = await fetch(p, opt); return r.json(); };
const post = (p, body) => api(p, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
const snake = (s) => String(s).replace(/([a-z0-9])([A-Z])/g, '$1_$2').replace(/[-\s]+/g, '_').toLowerCase();
const human = (s) => String(s).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const sevLabel = { block: 'stop', warn: 'warn', info: 'note' };
const sev = (s) => `<span class="sev ${s}">${sevLabel[s] || s}</span>`;
const owner = (o) => o ? human(String(o).split('@')[0]) + (o.includes('@') ? ' team' : '') : 'no one named yet';
const PALETTE = ['#2b5cff', '#0f766e', '#7c3aed', '#db2777', '#b45309', '#0369a1', '#4d7c0f', '#9f1239'];
const domainColor = (d) => { const i = (O.domains || []).findIndex(x => x.name === d); return i >= 0 ? PALETTE[i % PALETTE.length] : '#6e6e78'; };
const describe = async (name) => DC[name] || (DC[name] = await api(B + '/api/describe?name=' + encodeURIComponent(name)));

// ---------- derived facts ----------
function facts(){
  const types = O.types || [], rels = O.relationships || [], rules = O.constraints || [];
  const gapTypes = types.filter(t => t.described < t.fields);
  const unbound = types.filter(t => !t.has_source);
  const relsNoDesc = rels.filter(r => !r.description || !r.description.trim());
  const noOwner = rules.filter(r => !r.owner);
  const totalFields = types.reduce((n, t) => n + t.fields, 0) || 1;
  const described = types.reduce((n, t) => n + t.described, 0);
  const ready = !types.length ? 0 : Math.round(100 * ((described / totalFields) * 0.5 + (rels.length ? (rels.length - relsNoDesc.length) / rels.length : 1) * 0.3 + (types.length ? (types.length - unbound.length) / types.length : 1) * 0.2));
  return { types, rels, rules, gapTypes, unbound, relsNoDesc, noOwner, ready, pending: O.proposals_pending || 0 };
}
const rulesFor = (name) => (O.constraints || []).filter(c => c.applies_to === name || (O.relationships || []).some(r => r.name === c.applies_to && (r.from === name || r.to === name)));
const whenOf = (c) => { const rel = (O.relationships || []).find(r => r.name === c.applies_to || `${r.from}.${r.name}` === c.applies_to); const act = (O.actions || []).find(a => a.action === c.applies_to); return rel ? `when linking ${rel.from} to ${rel.to}` : (act ? `when running ${human(act.action).toLowerCase()}` : `whenever an action touches a ${c.applies_to}`); };

// ---------- boot / routing ----------
async function boot(){
  try { SPACES = await api('/api/spaces'); } catch (e) { SPACES = null; }
  if (SPACES) {
    // land on your first space; with none of your own yet, offer to create it (examples stay in the picker)
    const mine = SPACES.spaces.find(s => !s.builtin);
    if (!SPACE && mine) { location.replace(spaceUrl(mine.id, location.hash)); return; }
    renderSpacePicker();
    if (!SPACE || !SPACES.spaces.some(s => s.id === SPACE)) { renderNoSpace(); return; }
  }
  await loadSummary(); onHash();
}
function renderSpacePicker(){
  const sel = $('h-space'); if (!sel || !SPACES) return;
  const opt = (s) => `<option value="${esc(s.id)}" ${s.id===SPACE?'selected':''} title="${esc((s.description||'').trim())}">${esc(s.name)} · ${s.types} entit${s.types===1?'y':'ies'}${s.ok===false?' · has errors':''}</option>`;
  const grp = (label, list) => list.length ? `<optgroup label="${label}">${list.map(opt).join('')}</optgroup>` : '';
  const mine = SPACES.spaces.filter(s => !s.builtin), ex = SPACES.spaces.filter(s => s.group === 'example'), packs = SPACES.spaces.filter(s => s.group === 'pack');
  sel.innerHTML = (SPACE ? '' : '<option value="" selected>Pick a space…</option>') + grp('Your spaces', mine) + grp('Examples that ship with it', ex) + grp('Packs for common MCPs', packs) + (!SPACES.single ? `<option value="__new">＋ New space…</option>` : '');
}
function switchSpace(v){
  if (v === '__new') { $('h-space').value = SPACE || ''; go('new-space'); return; }
  if (v && v !== SPACE) location.href = spaceUrl(v, location.hash);
}
function renderNoSpace(message){
  $('h-name').textContent = 'Stella Ontology'; $('h-counts').textContent = ''; $('h-ready').textContent = ''; $('h-mode').textContent = SPACES && SPACES.editable ? 'edit mode' : 'read-only'; $('h-mode').className = 'pill ' + (SPACES && SPACES.editable ? '' : 'plain');
  $('nav').innerHTML = `<div style="font-size:12.5px;color:var(--muted);padding:8px;line-height:1.5">A space is one ontology: one brand, one business unit, one client. Pick one at the top, or create the first.</div>`;
  $('footer').innerHTML = SPACES ? `<span>${SPACES.spaces.filter(s => !s.builtin).length} space(s) of yours in <code>${esc(SPACES.root)}</code></span><span style="flex:1"></span><span>MCP: <code>stella-ontology mcp --dir ${esc(SPACES.root)}</code></span>` : '';
  const why = message ? `<div class="banner">${esc(message)}</div>` : (SPACE ? `<div class="banner">There is no space called <b>${esc(SPACE)}</b> here. Pick one at the top.</div>` : '');
  ui.ns = ui.ns || { name: '', from: 'blank' };
  $('view').innerHTML = main(why + (SPACE ? '' : newSpaceHtml(true)));
}
async function loadSummary(){
  O = await api(B + '/api/summary'); DC = {};
  if (O.error) { renderNoSpace(O.error); return; }
  $('h-md').href = B + '/api/summary.md';
  try { PR = await api(B + '/api/proposals'); } catch (e) { PR = { proposals: [], activity: [] }; }
  const f = facts(); const s = O.stats;
  $('h-name').textContent = O.manifest.name + (O.manifest.version ? ' v' + O.manifest.version : '');
  $('h-counts').textContent = `${s.types} entities · ${s.relationships} links · ${s.constraints} guardrails · ${s.actions} actions`;
  $('h-meter').style.width = f.ready + '%'; $('h-ready').textContent = f.ready + '% ready for agents';
  $('h-mode').textContent = O.editable ? (O.commit_edits ? 'edit mode · commits each change' : 'edit mode · changes stay uncommitted') : (O.space && O.space.builtin ? 'shipped ' + O.space.group + ' · read-only' : 'read-only');
  $('h-mode').className = 'pill ' + (O.editable ? '' : 'plain');
  renderNav(); renderFooter();
}
async function reload(){ await post(B + '/api/reload', {}); await loadSummary(); render(); }
function go(screen, arg){ const h = screen + (arg ? '/' + encodeURIComponent(arg) : ''); if (location.hash.slice(1) === h) { onHash(); } else { location.hash = h; } }
function onHash(){ const h = decodeURIComponent(location.hash.slice(1)); const [screen, ...rest] = h.split('/'); route = { screen: screen || 'map', arg: rest.join('/') }; ui.editor = null; renderNav(); render(); }
window.addEventListener('hashchange', onHash);
async function afterWrite(r){
  toast(r);
  if (r.written) { await loadSummary(); render(); }
}
function toast(r){
  const el = document.createElement('div'); el.className = 'toast' + (r.written ? '' : ' bad');
  const git = r.commit ? ` · committed ${r.commit}` : (r.git_error ? ` · git: ${r.git_error}` : (r.written ? ' · uncommitted, review with git diff' : ''));
  let h = r.written ? `✓ ${esc(r.summary || ('Saved ' + r.file))}${esc(git)}` : (r.error ? `✗ ${esc(r.error)}` : (r.refused ? `✗ ${esc(r.refused)}` : `✗ Not saved: ${r.errors || 0} error(s). Nothing was written.`));
  for (const d of (r.diagnostics || []).slice(0, 4)) h += `<div class="d ${d.level}">${d.level==='error'?'✗':'⚠'} ${esc(d.code)} ${esc(d.message)}</div>`;
  el.innerHTML = h; document.body.appendChild(el); setTimeout(() => el.remove(), r.written ? 4500 : 9000);
}
const ro = () => !O.editable;
const shipped = () => !!(O.space && O.space.builtin);
const roBanner = () => !ro() ? '' : shipped()
  ? `<div class="banner">This ${O.space.group === 'pack' ? 'pack' : 'example'} ships with Stella Ontology and stays read-only: browse it to see how things are done. ${SPACES && SPACES.editable && !SPACES.single ? `<a onclick="ui.ns={name:'',from:'${esc(O.space.id)}'};go('new-space')">Copy it into a space of your own</a> to change it.` : ''}</div>`
  : `<div class="banner">Read-only. Start the server with <code>--allow-edit</code> to change things from this page. Everything is still editable as YAML files in <code>${esc(O.dir)}</code>.</div>`;
async function patch(body){ if (ro()) { toast({ error: 'read-only: start with --allow-edit' }); return null; } const r = await post(B + '/api/patch', body); await afterWrite(r); return r; }

// ---------- rail ----------
function renderNav(){
  const f = facts(); const n = $('nav');
  const q = ui.search.trim();
  let h = `<input id="find" placeholder="Find anything…" value="${esc(ui.search)}" oninput="searchNav(this.value)">`;
  if (q) { n.innerHTML = h + '<h4>Results</h4><div id="find-results"><div class="empty">…</div></div>'; return; }
  const build = [
    ['sources', 'Sources', `${(O.sources||[]).length} connected · ${f.unbound.length} entities without data`, f.unbound.length > 0],
    ['entities', 'Entities', `${f.types.length} · ${f.gapTypes.length} need plain words`, f.gapTypes.length > 0],
    ['links', 'Links', `${f.rels.length} · ${f.relsNoDesc.length} without a sentence`, f.relsNoDesc.length > 0],
    ['rules', 'Guardrails', `${f.rules.length} · ${f.noOwner.length} with no sign-off`, f.noOwner.length > 0],
    ['actions', 'Actions', `${(O.actions||[]).length} things agents may do`, false]
  ];

let searchTimer;
function searchNav(q){

  const inp = $('find'); if (inp) { inp.focus(); inp.setSelectionRange(q.length, q.length); }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {

}
function openHit(kind, name){
  ui.search = '';
  if (kind === 'type') go('entities', name); else if (kind === 'constraint') go('rules', name); else if (kind === 'action') go('actions', name);
  else if (kind === 'relationship') go('links'); else if (kind === 'source') go('sources'); else if (kind === 'term') { const g = (O.glossary||[]).find(t => t.term === name); if (g) go('entities', g.means); }
}
function renderFooter(){

function render(){
  const v = $('view'); v.innerHTML = '';

const main = (inner, extra) => `<div class="main">${inner}</div>${extra || ''}`;
const stepHead = (n, title, desc) => `<div><div class="step-label">Step ${n}</div><h1>${title}</h1><div class="desc">${desc}</div></div>`;

// --- map ---
function layout(){
  const W = 220, H = 70, gx = 40, gy = 80, per = 4; const pos = {}; let y = 30, maxW = 0;
  for (const d of O.domains) {
    d.types.forEach((t, i) => { const col = i % per, row = Math.floor(i / per); pos[t.name] = [30 + col * (W + gx), y + row * (H + gy)]; maxW = Math.max(maxW, 30 + (col + 1) * (W + gx)); });
    y += Math.ceil(d.types.length / per) * (H + gy) + 30;
  }
  return { pos, W, H, width: Math.max(maxW + 30, 600), height: y + 20 };
}
function renderMap(v){
  const f = facts(); const L = layout();
  const byName = Object.fromEntries(f.types.map(t => [t.name, t]));
  let nodes = '', edges = '';
  for (const r of f.rels) {
    const p = L.pos[r.from], q = L.pos[r.to]; if (!p || !q) continue;
    const a = { x: p[0] + L.W/2, y: p[1] + L.H/2 }, b = { x: q[0] + L.W/2, y: q[1] + L.H/2 };
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx*dx + dy*dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
    const on = ui.mapSel === r.from || ui.mapSel === r.to;
    edges += `<div class="edge ${on?'on':''}" style="left:${a.x}px;top:${a.y}px;width:${len}px;transform:rotate(${ang}deg)"></div><div class="elabel ${on?'on':''}" style="left:${(a.x+b.x)/2-44}px;top:${(a.y+b.y)/2-10}px;opacity:${on || !ui.mapSel ? 1 : .35}">${esc(r.name)}</div>`;
  }
  for (const t of f.types) {
    const [x, y] = L.pos[t.name] || [30, 30]; const rs = rulesFor(t.name); const blocks = rs.filter(c => c.severity === 'block').length; const gaps = t.fields - t.described;
    nodes += `<button class="node ${ui.mapSel===t.name?'sel':''}" style="left:${x}px;top:${y}px" onclick="mapPick('${esc(t.name)}')"><div class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${domainColor(t.domain)}"></i><b>${esc(t.name)}</b></div><div class="tags">${blocks?`<span style="background:var(--block-bg);color:var(--block)">${blocks} stop</span>`:''}${gaps?`<span style="background:var(--warn-bg);color:var(--warn)">${gaps} need words</span>`:''}${!t.has_source?`<span style="background:var(--chip);color:var(--muted)">no data yet</span>`:''}</div></button>`;
  }
  const legend = O.domains.map(d => `<span><i style="background:${domainColor(d.name)}"></i>${esc(d.name)}</span>`).join('');
  const t = byName[ui.mapSel];
  let side = '';
  if (t) side += `<div style="display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)"><div class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${domainColor(t.domain)}"></i><h2>${esc(t.name)}</h2></div><div style="font-size:13.5px">${esc(t.description)}</div><div style="font-size:12.5px;color:var(--muted)">${t.fields} fields · ${f.rels.filter(r => r.from===t.name||r.to===t.name).length} links · ${rulesFor(t.name).length} guardrails · ${t.has_source ? esc((t.source_kind||'inline') + ' ' + (t.source_table||'')) : 'no data bound'}</div><div class="row"><button class="primary small" onclick="go('entities','${esc(t.name)}')">Open</button><button class="small" onclick="ui.ruleQuery='${esc(t.name)}';go('rules')">Its guardrails</button></div></div>`;
  const nudges = [];
  if (!f.types.length) nudges.push(['No entities yet', 'Start with the nouns of the business: Customer, Order, Campaign. Each becomes a small YAML file that agents read.', 'Add the first entity', "go('entities')"]);
  if (shipped()) nudges.push([`A shipped ${O.space.group}, read-only`, 'Browse it to see how things are described, linked and guarded. Copy it to make it yours.', 'Copy into a new space', `ui.ns={name:'',from:'${esc(O.space.id)}'};go('new-space')`]);
  if (f.pending) nudges.push([`${f.pending} change${f.pending>1?'s':''} proposed by agents`, 'Something an agent learned while answering your team. Review it so the next person gets the same answer.', 'Review', "go('agents')"]);
  if (f.gapTypes.length) nudges.push([`${f.gapTypes.length} entities have fields without plain words`, f.gapTypes.slice(0, 4).map(t => `${t.name} (${t.fields - t.described})`).join(', ') + (f.gapTypes.length > 4 ? '…' : ''), 'Add words', `ui.typeTab='fields';go('entities','${esc(f.gapTypes[0].name)}')`]);
  if (f.relsNoDesc.length) nudges.push([`${f.relsNoDesc.length} links have no sentence`, 'One line each, like "The carrier currently booked for the parcel".', 'Describe links', "go('links')"]);
  if (f.unbound.length) nudges.push([`${f.unbound.map(t => t.name).join(' and ')} have no data behind them`, 'Agents can read their rules but cannot check a real row.', 'Bind a table', `ui.typeTab='data';go('entities','${esc(f.unbound[0].name)}')`]);
  if (f.noOwner.length) nudges.push([`${f.noOwner.length} guardrails have no sign-off`, f.noOwner.map(r => r.id).join(', '), 'Name an owner', `go('rules','${esc(f.noOwner[0].id)}')`]);
  if (!nudges.length) nudges.push(['Nothing waiting', 'Every field has words, every link a sentence, every entity a table. Agents have what they need.', 'See agents', "go('agents')"]);
  side += `<h4>What to do next</h4>` + nudges.map(([t, d, cta, js]) => `<div class="card"><b style="font-size:13.5px">${esc(t)}</b><div style="font-size:12.5px;color:var(--muted)">${esc(d)}</div><button class="small" style="align-self:flex-start" onclick="${js}">${cta}</button></div>`).join('');
  v.innerHTML = `<div class="map"><div style="position:relative;width:${L.width}px;height:${L.height}px;margin:0 auto">${edges}${nodes}</div><div class="legend">${legend}</div></div><div class="aside">${side}</div>`;
}

function newTypeForm(){ ui.newType = { name: '', domain: (O.domains[0] || {}).name || '', desc: '' }; render(); }

async function runTry(name){
  const d = await describe(name); const inputs = {};
  for (const k of Object.keys(d.inputs || {})) { let v = (ui.tryInputs[name+'.'+k] || '').trim(); if (!v) continue; if (v.startsWith('{')) { try { v = JSON.parse(v); } catch (e) {} } inputs[k] = v; }
  const r = await post(B + '/api/check', { action: name, inputs });
  const text = r.content && r.content[0] ? r.content[0].text : '';
  let rep; try { rep = JSON.parse(text); } catch (e) { rep = { verdict: 'fail', summary: text, results: [], suggestions: [], notes: [] }; }
  ui.tryResult = { action: name, rep }; render();
}

function diffHtml(before, after){
  const a = (before||'').split('\n'), b = (after||'').split('\n'); const sa = new Set(a), sb = new Set(b);
  const out = []; let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (i < a.length && j < b.length && a[i] === b[j]) { out.push(['=', a[i]]); i++; j++; }
    else if (j < b.length && !sa.has(b[j])) { out.push(['+', b[j]]); j++; }
    else if (i < a.length && !sb.has(a[i])) { out.push(['-', a[i]]); i++; }
    else if (j < b.length) { out.push(['+', b[j]]); j++; } else { out.push(['-', a[i]]); i++; }
  }
  const changed = out.filter(x => x[0] !== '=').length;
  const keep = []; out.forEach((x, k) => { if (x[0] !== '=' || out.slice(Math.max(0,k-2), k+3).some(y => y[0] !== '=')) keep.push(x); });
  if (!changed) return '(identical to the current file)';
  return keep.map(([m, l]) => `<div class="${m==='+'?'add':(m==='-'?'del':'')}">${m==='='?' ':m} ${esc(l)}</div>`).join('');
}
async function decide(id, what){ const r = await post(B + '/api/proposals/' + what, { id }); if (what === 'accept') await afterWrite({ ...r, summary: r.written ? 'Accepted and written to ' + r.file : undefined }); else { toast({ written: true, summary: 'Set aside' }); } render(); }
const toolExamples = { search: {query: 'lead time'}, describe: {name: ''}, neighbors: {name: '', depth: 1}, path: {from: '', to: ''}, constraints_for: {name: ''}, validate: {action: '', inputs: {}}, where_is: {type: ''}, instances: {type: '', limit: 3}, summary: {}, query: {sql: 'select name from nodes limit 5'}, tables: {}, propose_change: {file: 'glossary.yaml', content: '', reason: ''} };
function toolTemplate(){ const n = $('tool-name'); if (!n) return; const ex = JSON.parse(JSON.stringify(toolExamples[n.value] || {})); const t0 = (O.types[0]||{}).name || ''; for (const k of ['name','type','from']) if (k in ex && !ex[k]) ex[k] = t0; if ('to' in ex && !ex.to) ex.to = (O.types[1]||O.types[0]||{}).name || ''; if ('action' in ex) ex.action = (O.actions[0]||{}).action || ''; $('tool-args').value = JSON.stringify(ex, null, 2); }
async function runTool(){ let args = {}; try { args = JSON.parse($('tool-args').value || '{}'); } catch (e) { $('tool-out').style.display = 'block'; $('tool-out').textContent = 'arguments are not valid JSON: ' + e.message; return; } const r = await post(B + '/api/tool', { name: $('tool-name').value, arguments: args }); $('tool-out').style.display = 'block'; $('tool-out').textContent = (r.isError ? '[error] ' : '') + (r.content && r.content[0] ? r.content[0].text : JSON.stringify(r, null, 2)); if ($('tool-name').value === 'propose_change') { PR = await api(B + '/api/proposals'); await loadSummary(); } }

// --- data & sql ---
async function renderData(v){
  TABLES = await api(B + '/api/tables').catch(() => null);
  const sources = (O.sources||[]).map(s => `<span class="chip"><b>${esc(s.connection)}</b> · ${esc(s.kind)}</span>`).join('');
  const chips = TABLES && !TABLES.error ? (TABLES.tables||[]).map(n => `<span class="chip pick" onclick="useSql('select * from ${n} limit 20')">${n}</span>`).join('') + (TABLES.views||[]).map(x => `<span class="chip pick" title="${esc(x.source)}" onclick="useSql('select * from ${esc(x.view)} limit 20')">${esc(x.view)}</span>`).join('') : '<span style="color:var(--muted)">SQL is unavailable in this build.</span>';
  const skipped = TABLES ? Object.entries(TABLES.skipped||{}).map(([k, w]) => `<div style="font-size:12.5px;color:var(--muted)">✗ <b>${esc(k)}</b>: ${esc(w)}</div>`).join('') + Object.entries(TABLES.not_readable||{}).map(([k, w]) => `<div style="font-size:12.5px;color:var(--muted)">– <b>${esc(k)}</b>: ${esc(w)} is not read here</div>`).join('') : '';
  let out = '';
  if (ui.sqlOut) { const r = ui.sqlOut; out = r.error ? `<div class="verdict fail">${esc(r.error)}</div>` : `<div style="overflow:auto"><table><tr>${r.columns.map(c => `<th title="${esc(c.type)}">${esc(c.name)}</th>`).join('')}</tr>${r.rows.map(row => `<tr>${r.columns.map(c => `<td class="mono">${row[c.name]===null||row[c.name]===undefined?'<span style="color:var(--muted)">∅</span>':esc(typeof row[c.name]==='object'?JSON.stringify(row[c.name]):row[c.name])}</td>`).join('')}</tr>`).join('')}</table></div><div style="font-size:12px;color:var(--muted)">${r.row_count} row${r.row_count===1?'':'s'}${r.truncated?` (truncated at ${r.limit})`:''} · ${r.elapsed_ms} ms · DuckDB, read-only</div>`; }
  v.innerHTML = main(`<h1>Data &amp; SQL</h1><div class="desc">One SQL door across the ontology and every readable source. Read-only. The ontology is in <span class="mono">nodes, properties, edges, constraints, actions, sources</span>; every readable entity is a view named after it.</div><div>${sources}</div><div>${chips}</div>${skipped}<textarea id="sql-in" class="mono" rows="4" spellcheck="false">${esc(ui.sql)}</textarea><div class="row"><button class="primary" onclick="runSql()">Run</button><span style="font-size:12.5px;color:var(--muted)">⌘/Ctrl+Enter runs</span></div>${out}`);
  const t = $('sql-in'); t.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runSql(); });
}
function useSql(q){ ui.sql = q; runSql(); }
async function runSql(){ const t = $('sql-in'); if (t) ui.sql = t.value; ui.sqlOut = await post(B + '/api/query', { sql: ui.sql }); render(); }

// --- diagnostics ---
function renderDiagnostics(v){ v.innerHTML = main(`<h1>Diagnostics</h1>` + (O.diagnostics.map(d => `<div class="d ${d.level}">${d.level==='error'?'✗':'⚠'} ${esc(d.code)} ${esc(d.message)} <span style="color:var(--faint)">${esc(d.file)}</span></div>`).join('') || '<div class="empty">Clean</div>')); }

// --- YAML editor (whole file) and template-based creation ---
async function openEditor(file, name, kind){
  const text = await fetch(B + '/api/yaml?file=' + encodeURIComponent(file)).then(r => r.text());
  ui.editor = { file, name, kind, text, isNew: false };
  if (route.screen !== 'entities' && route.screen !== 'actions') { $('view').innerHTML = main(editorHtml()); wireEditor(); } else render();
}
async function startNew(kind){
  if (ro()) { toast({ error: 'read-only: start with --allow-edit' }); return; }
  TEMPLATES = TEMPLATES || await api(B + '/api/templates');
  const t0 = (O.types[0]||{}).name || 'Customer';
  ui.editor = { file: '', name: '', kind, text: '', isNew: true, applies_to: t0, touched: false, constraintFile: (O.constraint_files||[])[0] || '' };
  fillTemplate();
  $('view').innerHTML = main(editorHtml()); wireEditor(); const n = $('new-name'); if (n) n.focus();
}
const kindFolder = { type: 'types', action: 'actions', relationship: 'relationships', source: 'sources', constraint: 'constraints' };
function fillTemplate(){ const e = ui.editor; const name = e.name || { type: 'NewType', constraint: 'NEW-001', action: 'new_action', relationship: 'relates_to', source: 'new_source' }[e.kind]; e.text = (TEMPLATES[e.kind] || '').replaceAll('{{name}}', name).replaceAll('{{snake}}', snake(name)).replaceAll('{{applies_to}}', e.applies_to).replaceAll('{{input}}', snake(e.applies_to)); }
function editorHtml(){
  const e = ui.editor;
  const head = e.isNew ? `<h1>New ${e.kind === 'constraint' ? 'guardrail' : e.kind}</h1><div class="desc">Fill in the template and save. ${e.kind === 'constraint' ? 'The rule is appended to the chosen file; the rest of that file stays exactly as it is.' : `The file goes to <code id="new-path">${esc(kindFolder[e.kind])}/${esc(snake(e.name||'<name>'))}.yaml</code>.`}</div><div class="form"><label>Name</label><input id="new-name" value="${esc(e.name)}" oninput="newNameChanged(this.value)">${e.kind==='constraint'?`<label>File</label><select onchange="ui.editor.constraintFile=this.value">${(O.constraint_files||[]).map(f => `<option ${e.constraintFile===f?'selected':''}>${esc(f)}</option>`).join('')}<option value="">new file: constraints/&lt;id&gt;.yaml</option></select>`:''}</div>` : `<div class="row"><h1>${esc(e.name)}<small>editing ${esc(e.file)}</small></h1></div>`;
  return head + `<div id="ed-diags"></div><textarea id="ed-text" class="yaml" spellcheck="false" ${e.isNew?'oninput="ui.editor.touched=true"':''}>${esc(e.text)}</textarea><div class="row"><button class="primary" onclick="${e.isNew?'saveNew()':'saveEdit()'}">Save</button><button onclick="cancelEdit()">Cancel</button><span style="font-size:12.5px;color:var(--muted)">⌘/Ctrl+S saves · the whole ontology is compiled with your text in place before anything is written</span><span style="flex:1"></span>${e.isNew?'':'<button class="danger" onclick="deleteFile()">Delete file</button>'}</div>`;
}
function wireEditor(){ const t = $('ed-text'); if (!t) return; t.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); ui.editor.isNew ? saveNew() : saveEdit(); } if (e.key === 'Tab') { e.preventDefault(); const s = t.selectionStart, en = t.selectionEnd; t.value = t.value.slice(0, s) + '  ' + t.value.slice(en); t.selectionStart = t.selectionEnd = s + 2; ui.editor.touched = true; } }); }
function newNameChanged(v){ ui.editor.name = v.trim(); if (!ui.editor.touched) { fillTemplate(); $('ed-text').value = ui.editor.text; } const p = $('new-path'); if (p) p.textContent = `${kindFolder[ui.editor.kind]}/${snake(ui.editor.name||'<name>')}.yaml`; }
function showDiags(r){ const el = $('ed-diags'); if (!el) return; let h = r.error ? `<div class="d error">✗ ${esc(r.error)}</div>` : (!r.ok ? `<div class="d error">✗ Not saved: fix the ${r.errors} error${r.errors===1?'':'s'} below. Nothing was written.</div>` : ''); for (const d of (r.diagnostics||[])) h += `<div class="d ${d.level}">${d.level==='error'?'✗':'⚠'} ${esc(d.code)} ${esc(d.message)}${d.file?` <span style="opacity:.7">[${esc(d.file)}]</span>`:''}</div>`; el.innerHTML = h; }
async function saveEdit(){ const r = await post(B + '/api/edit', { file: ui.editor.file, content: $('ed-text').value }); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite(r); }
async function saveNew(){ const e = ui.editor; if (!e.name) { showDiags({ error: 'Give it a name first.' }); return; } const body = { kind: e.kind, name: e.name, content: $('ed-text').value }; if (e.kind === 'constraint' && e.constraintFile) body.file = e.constraintFile; const r = await post(B + '/api/create', body); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite(r); const dest = { type: ['entities', r.name || e.name], constraint: ['rules', r.name || e.name], action: ['actions', r.name || e.name], relationship: ['links', ''], source: ['sources', ''] }[e.kind]; if (dest) go(dest[0], dest[1]); }
function cancelEdit(){ ui.editor = null; render(); }
async function deleteFile(){ const file = ui.editor.file; if (!confirm(`Delete ${file}?\n\nThe ontology is compiled without it first: anything that still refers to what it declares blocks the delete.`)) return; const r = await fetch(B + '/api/file?file=' + encodeURIComponent(file), { method: 'DELETE' }).then(x => x.json()); if (!r.written) { showDiags(r); return; } ui.editor = null; await afterWrite({ ...r, summary: 'Deleted ' + file }); go(route.screen); }

boot();
</script>
